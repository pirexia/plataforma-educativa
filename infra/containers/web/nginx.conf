# ADR-037 §3.4: solo sirve los ficheros estáticos de la SPA. Sin
# proxy_pass, sin upstream, sin ninguna relación hacia el contenedor de la
# API — Traefik es el único que enruta /api/* (ADR-028 §1). CI falla si
# aparece "proxy_pass" en cualquier fichero de infra/containers/web/.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enrutado del lado del cliente (vue-router en modo history): cualquier
    # ruta que no sea un fichero real cae a index.html, y la SPA decide.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los ficheros con hash en el nombre (assets de Vite) son inmutables:
    # caché larga. index.html no lo es, o un despliegue nuevo no se vería
    # hasta que expirase la caché del navegador.
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }
}
