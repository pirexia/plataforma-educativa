# Garage de desarrollo, CI y E2E (ADR-076 §6). Un solo nodo, solo datos sintéticos.
# Sin secretos: rpc_secret y admin_token entran por GARAGE_RPC_SECRET y
# GARAGE_ADMIN_TOKEN (variables de entorno del contenedor).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
