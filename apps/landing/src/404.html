<!doctype html>
<html lang="{{v:lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>{{t:notfound.title}}</title>
<meta name="description" content="{{t:notfound.meta.description}}">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="skip-link" href="#main">{{t:a11y.skip}}</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/">{{t:brand.name}}</a>
  </div>
</header>
<main id="main" tabindex="-1" class="container prose">
  <h1>{{t:notfound.h1}}</h1>
  <p>{{t:notfound.text}}</p>
  <nav aria-label="{{t:nav.language.label}}">
    <ul class="lang-list">
      <li><a href="/" lang="es-ES" hreflang="es-ES">{{t:lang.name.es-ES}}</a></li>
      <li><a href="/en/" lang="en" hreflang="en">{{t:lang.name.en}}</a></li>
      <li><a href="/de/" lang="de" hreflang="de">{{t:lang.name.de}}</a></li>
      <li><a href="/fr/" lang="fr" hreflang="fr">{{t:lang.name.fr}}</a></li>
    </ul>
  </nav>
</main>
</body>
</html>
