# ADR-038 §12.2. Único sitio donde se define el esquema Problem (§6),
# PageMeta/CursorMeta (§4), los parámetros comunes (page, per_page,
# cursor, limit, sort, q, Idempotency-Key) y el formato ulid. Un módulo
# que redefina cualquiera de esto en vez de referenciarlo con $ref es un
# fallo de revisión visible en el diff (ADR-038 §12.2).

components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 application/problem+json (ADR-038 §6).
      required: [type, title, status]
      properties:
        type:
          type: string
          description: URN estable del catálogo cerrado de ADR-038 §6.2.
          example: "urn:pge:error:validation"
        title:
          type: string
          example: "Los datos enviados no son válidos"
        status:
          type: integer
          example: 422
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
          description: Ruta de la petición, sin parámetros de consulta.
        request_id:
          type: string
          format: ulid
          nullable: true
        errors:
          type: object
          nullable: true
          description: Por campo, lista de {code, message, params} ya traducido (ADR-038 §6.3).
          additionalProperties:
            type: array
            items:
              type: object
              required: [code, message]
              properties:
                code:
                  type: string
                  example: "core.validation.locale_not_active"
                message:
                  type: string
                params:
                  type: object
                  additionalProperties: true

    PageMeta:
      type: object
      description: Metadatos de paginación por página (ADR-038 §4.3). Catálogos de entidades.
      required: [current_page, per_page, total, last_page]
      properties:
        current_page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        last_page: { type: integer, minimum: 0 }

    CursorMeta:
      type: object
      description: Metadatos de paginación por cursor (ADR-038 §4.4). Flujos de eventos append-only.
      required: [has_more]
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Opaco y cifrado (AES-256-GCM). Nunca base64 legible.
        has_more:
          type: boolean

    Person:
      type: object
      properties:
        public_id: { $ref: '#/components/schemas/PublicId' }
        given_name: { type: string }
        family_name_1: { type: string }
        family_name_2: { type: string, nullable: true }
        contact_email: { type: string, format: email, nullable: true }
        contact_phone: { type: string, nullable: true }
        document_type: { type: string, nullable: true }
        document_number: { type: string, nullable: true }
        birth_date: { type: string, format: date, nullable: true }
        locale: { $ref: '#/components/schemas/Locale' }

    RoleSummary:
      type: object
      properties:
        public_id: { $ref: '#/components/schemas/PublicId' }
        code: { type: string }
        name: { type: string }

    User:
      type: object
      description: >
        Forma exacta de UserProfilePresenter::present() — compartida por
        GET /me (REQ-CORE) y POST /auth/session (REQ-AUTH, api.md §2.6.6):
        misma respuesta para que la SPA no encadene una segunda petición
        tras el login. Corregido en 1.2 (issue detectado al redactar este
        fichero): la versión anterior listaba email_verified_at/created_at/
        updated_at/deleted_at, que el presentador nunca devuelve, y le
        faltaba permissions, que sí devuelve siempre.
      properties:
        public_id: { $ref: '#/components/schemas/PublicId' }
        email: { type: string, format: email }
        status:
          type: string
          enum: [pendiente, activo, inactivo]
          description: Enumerado extensible (ADR-038 §7.3).
        person: { $ref: '#/components/schemas/Person' }
        roles:
          type: array
          items: { $ref: '#/components/schemas/RoleSummary' }
        permissions:
          type: array
          description: Códigos de permiso efectivos del usuario autenticado.
          items: { type: string }
        mfa:
          type: object
          description: >
            REQ-AUTH-003 (1.3), funcional.md §C.4.8: "avisos en cada
            acceso" sin endpoint nuevo. Ampliación aditiva (ADR-038 §7.3).
          properties:
            enrolled: { type: boolean, description: Tiene al menos un factor confirmado y utilizable. }
            obligated: { type: boolean }
            enforced: { type: boolean, description: Obligado y gracia vencida (el muro se aplicará). }
            grace_deadline_at: { type: string, format: date-time, nullable: true }
            days_remaining: { type: integer, nullable: true }

    Invitation:
      type: object
      properties:
        public_id: { $ref: '#/components/schemas/PublicId' }
        user:
          type: object
          properties:
            public_id: { $ref: '#/components/schemas/PublicId' }
            email: { type: string, format: email }
        status:
          type: string
          enum: [vigente, caducada, revocada, aceptada]
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }

    Role:
      type: object
      properties:
        public_id: { $ref: '#/components/schemas/PublicId' }
        code: { type: string }
        name: { type: string }
        is_system: { type: boolean }
        mfa_required: { type: boolean }
        special_data_access: { type: boolean }
        users_count: { type: integer }
        permissions:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              resource: { type: string }
              action: { type: string }
              effect: { type: string, enum: [allow, deny] }
              scope: { type: string }

    Permission:
      type: object
      properties:
        code: { type: string }
        resource: { type: string }
        action: { type: string }
        module_code: { type: string }
        is_special_category: { type: boolean }
        retired_at: { type: string, format: date-time, nullable: true }

    ModuleSubscription:
      type: object
      properties:
        public_id: { $ref: '#/components/schemas/PublicId' }
        module_code: { type: string }
        name: { type: string }
        phase: { type: string }
        enabled: { type: boolean }
        enabled_at: { type: string, format: date-time, nullable: true }
        disabled_at: { type: string, format: date-time, nullable: true }
        settings: { type: object, additionalProperties: true }

    TenantSettings:
      type: object
      properties:
        public_id: { $ref: '#/components/schemas/PublicId' }
        regional:
          type: object
          properties:
            default_locale: { $ref: '#/components/schemas/Locale' }
            active_locales:
              type: array
              items: { $ref: '#/components/schemas/Locale' }
            timezone: { type: string }
            currency: { type: string }
            autonomous_community: { type: string, nullable: true }
        fiscal:
          type: object
          properties:
            legal_name: { type: string, nullable: true }
            tax_id: { type: string, nullable: true }
            address: { type: string, nullable: true }
            postal_code: { type: string, nullable: true }
            city: { type: string, nullable: true }
            province: { type: string, nullable: true }
            country_code: { type: string, nullable: true }
        branding:
          type: object
          properties:
            color_primary: { type: string, nullable: true }
            color_secondary: { type: string, nullable: true }
            logo_url: { type: string, format: uri, nullable: true }
            favicon_url: { type: string, format: uri, nullable: true }
            login_background_url: { type: string, format: uri, nullable: true }
        security:
          type: object
          description: REQ-AUTH/api.md §6 (REQ-AUTH-005 punto 1). No es un recurso nuevo, grupo añadido en 1.2.
          properties:
            session_timeout_minutes:
              type: integer
              minimum: 5
              maximum: 480
              description: RN-AUTH-30. Por defecto 30.
            mfa_allowed_methods:
              type: array
              description: >
                REQ-AUTH-003 (1.3), funcional.md §C.4.12, RN-AUTH-69.
                Siempre contiene totp; nunca sms (sin proveedor, §C.7).
              items: { type: string, enum: [totp, email, sms] }
              default: [totp]
            mfa_grace_period_days:
              type: integer
              minimum: 1
              maximum: 90
              default: 7
              description: RN-AUTH-65.
        updated_at: { type: string, format: date-time }

    TenantBranding:
      type: object
      description: "Único endpoint sin autenticación del módulo (funcional.md §4.8). No devuelve nada más que esto."
      properties:
        name: { type: string }
        color_primary: { type: string, nullable: true }
        color_secondary: { type: string, nullable: true }
        logo_url: { type: string, format: uri, nullable: true }
        favicon_url: { type: string, format: uri, nullable: true }
        login_background_url: { type: string, format: uri, nullable: true }
        default_locale: { $ref: '#/components/schemas/Locale' }
        active_locales:
          type: array
          items: { $ref: '#/components/schemas/Locale' }

    AuditLog:
      type: object
      properties:
        public_id: { $ref: '#/components/schemas/PublicId' }
        occurred_at: { type: string, format: date-time }
        actor:
          type: object
          nullable: true
          properties:
            public_id: { $ref: '#/components/schemas/PublicId' }
            display_name: { type: string }
        actor_type:
          type: string
          description: "Enumerado extensible (ADR-038 §7.3). 'anonymous' añadido por ADR-039 (REQ-AUTH)."
          enum: [user, system, console, import, platform, anonymous]
        auditable_type: { type: string }
        auditable_public_id: { $ref: '#/components/schemas/PublicId' }
        event:
          type: string
          description: "Enumerado extensible (ADR-038 §7.3). login/logout/password_reset_requested añadidos por ADR-039 (REQ-AUTH)."
          enum: [created, updated, deleted, restored, read, exported, login, logout, password_reset_requested]
        changes: { type: object, nullable: true, additionalProperties: true }
        ip_address: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        request_id: { type: string, format: ulid, nullable: true }

    DataExport:
      type: object
      properties:
        public_id: { $ref: '#/components/schemas/PublicId' }
        kind: { type: string }
        status:
          type: string
          enum: [pendiente, generando, completada, fallida]
        row_count: { type: integer, nullable: true }
        download_url: { type: string, format: uri, nullable: true }
        expires_at: { type: string, format: date-time }

    UserImportErrorEntry:
      type: object
      properties:
        line: { type: integer }
        column: { type: string }
        code: { type: string }
        message: { type: string }

    UserImport:
      type: object
      properties:
        public_id: { $ref: '#/components/schemas/PublicId' }
        original_filename: { type: string }
        status:
          type: string
          enum: [subido, validando, validado, fallido, ejecutando, completado]
        row_count: { type: integer, nullable: true }
        error_count: { type: integer, nullable: true }
        created_count: { type: integer, nullable: true }
        error_summary:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/UserImportErrorEntry' }
        report_url: { type: string, format: uri, nullable: true }
        validated_at: { type: string, format: date-time, nullable: true }
        executed_at: { type: string, format: date-time, nullable: true }

    AccountLockout:
      type: object
      description: REQ-AUTH/api.md §5. Bloqueo de cuenta por intentos fallidos consecutivos.
      properties:
        public_id: { $ref: '#/components/schemas/PublicId' }
        email: { type: string, format: email }
        user:
          type: object
          nullable: true
          description: "null en un bloqueo fantasma (RN-AUTH-15, correo sin cuenta)."
          properties:
            public_id: { $ref: '#/components/schemas/PublicId' }
            email: { type: string, format: email }
        status:
          type: string
          description: Derivado, no una columna.
          enum: [vigente, levantado]
        failed_count: { type: integer }
        locked_at: { type: string, format: date-time }
        unlocked_at: { type: string, format: date-time, nullable: true }
        unlocked_by:
          type: string
          format: ulid
          nullable: true
          description: public_id de quien desbloqueó, o null (caducidad/correo, RN-AUTH-18).

    UserSession:
      type: object
      description: >
        REQ-AUTH/api.md §B.2 (1.2b). Una sesión activa del usuario
        autenticado. Nunca lleva el identificador de sesión del framework
        ni material de la cookie de dispositivo (RN-AUTH-40).
      properties:
        public_id: { $ref: '#/components/schemas/PublicId' }
        current:
          type: boolean
          description: true en la sesión desde la que se hace la petición. Exactamente una fila lo lleva.
        started_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
        ip_address: { type: string, nullable: true, description: IP completa del propio titular, sin enmascarar. }
        client:
          type: object
          properties:
            browser: { type: string, description: "'desconocido' si el User-Agent es irreconocible." }
            platform: { type: string }
            device_type: { type: string, enum: [escritorio, movil, tableta, bot, desconocido] }
        location:
          type: string
          nullable: true
          description: Siempre null en 1.2b (RN-AUTH-47, OPEN-AUTH-13). No es un error ni un campo ausente.
        device_known:
          type: boolean
          description: Si esta sesión venía de un dispositivo ya reconocido para la cuenta.

    MfaEnrollment:
      type: object
      description: >
        REQ-AUTH-003 (1.3/1.3b), funcional.md §C.4.1 punto 4, §D.4.1.
        Respuesta de `POST /auth/mfa-enrollments`. Dos formas mutuamente
        excluyentes según `method`, a propósito (api.md §D.2): `totp`
        devuelve `secret`/`otpauth_uri` (UNA SOLA VEZ, RN-AUTH-55) y nunca
        `destination_masked`/`code_expires_at`; un método de entrega
        (`email`) devuelve `destination_masked`/`code_expires_at` y nunca
        `secret`/`otpauth_uri` — no hay nada verificable que devolver
        (RN-AUTH-75): el código no sale del servidor.
      properties:
        public_id: { $ref: '#/components/schemas/PublicId' }
        method: { type: string, enum: [totp, email] }
        secret:
          type: string
          description: Solo `method=totp`. Base32, para introducción manual si no se puede escanear el QR (§C.11, WCAG 2.2 AA).
        otpauth_uri:
          type: string
          description: Solo `method=totp`. URI otpauth:// completa — la SPA la pinta como QR con uqr, nunca la reconstruye.
        destination_masked:
          type: string
          description: >
            Solo `method=email` (1.3b, RN-AUTH-75/§D.4.5). Regla de
            enmascarado determinista de funcional.md §D.4.5, calculada al
            presentar, nunca persistida.
          example: "a···z@e···e.com"
        code_expires_at:
          type: string
          format: date-time
          description: >
            Solo `method=email` (1.3b). Caducidad del código de 6 dígitos
            (AUTH_MFA_CODE_TTL_MINUTES), distinta de `expires_at` del alta
            (api.md §D.6.4).
        expires_at: { type: string, format: date-time, description: RN-AUTH-59, 10 minutos por defecto. }

    MfaFactor:
      type: object
      description: Nunca incluye el secreto ni ningún hash (RN-AUTH-55/56).
      properties:
        public_id: { $ref: '#/components/schemas/PublicId' }
        method: { type: string, enum: [totp, email, sms] }
        is_preferred: { type: boolean }
        destination_masked:
          type: string
          description: >
            1.3b, RN-AUTH-75/77. Presente solo si `method` entrega algo
            (api.md §D.6.2: un campo ausente no es un campo nulo) — no
            aparece en absoluto en un factor `totp`.
          example: "a···z@e···e.com"
        confirmed_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }

    MfaFactorConfirmation:
      type: object
      description: Respuesta de `POST /auth/mfa-factors`.
      properties:
        factor: { $ref: '#/components/schemas/MfaFactor' }
        recovery_codes:
          type: array
          nullable: true
          description: >
            Solo cuando se han generado — el primer factor confirmado del
            usuario (§C.4.1 punto 9). En claro, una sola vez (RN-AUTH-56).
          items: { type: string, example: "A3F7K-9QRT2" }

    MfaStatus:
      type: object
      description: Respuesta de `GET /auth/mfa` — estado completo del propio usuario.
      properties:
        allowed_methods:
          type: array
          description: >
            1.3b (funcional.md §D.2.4, api.md §D.3.1). `mfa_allowed_methods`
            del tenant — para que la pantalla ofrezca el correo solo si el
            centro lo admite. No es un permiso relajado: información sobre
            la configuración del centro, no de otros usuarios.
          items: { type: string, enum: [totp, email, sms] }
        factors:
          type: array
          items: { $ref: '#/components/schemas/MfaFactor' }
        unused_recovery_codes_count: { type: integer }
        mfa:
          type: object
          properties:
            enrolled: { type: boolean }
            obligated: { type: boolean }
            enforced: { type: boolean }
            grace_deadline_at: { type: string, format: date-time, nullable: true }
            days_remaining: { type: integer, nullable: true }
            exempt_until:
              type: string
              format: date-time
              nullable: true
              description: >
                1.3b (api.md §D.3.1). Caducidad de la excepción temporal
                propia, o `null` si no tiene ninguna viva. Permite avisar
                sin enviar ningún correo (funcional.md §D.4.10). Solo
                aquí — el bloque `mfa` de `GET /me` no se amplía.

    MfaChallenge:
      type: object
      description: >
        REQ-AUTH-003 (1.3/1.3b), funcional.md §C.4.4/§C.6/§D.4.2. Respuesta
        202 del paso 1 del login y de POST /auth/mfa-challenges. Nunca
        lleva token, session_id ni secreto (RN-AUTH-53/56/84) — la única
        credencial es la cookie de sesión que el cliente ya tiene.
      properties:
        public_id: { $ref: '#/components/schemas/PublicId' }
        method: { type: string, enum: [totp, email, sms] }
        available_methods:
          type: array
          items: { type: string, enum: [totp, email, sms] }
        destination_masked:
          type: string
          description: >
            1.3b (RN-AUTH-75/84, api.md §D.6.2). Presente solo si el
            método en curso del desafío entrega algo — ausente, no nulo,
            cuando `method=totp`.
          example: "a···z@e···e.com"
        expires_at: { type: string, format: date-time, description: RN-AUTH-54, 5 minutos por defecto. }
        has_unused_recovery_codes: { type: boolean }

    MfaComplianceSummary:
      type: object
      description: >
        REQ-AUTH-003 (1.3), funcional.md §C.1.1 punto 9. Respuesta de
        `GET /mfa-compliance` — vista previa hipotética (preview=true,
        sin escribir nada) o estado real (preview=false) del mismo rol.
      properties:
        role:
          type: object
          properties:
            public_id: { $ref: '#/components/schemas/PublicId' }
            code: { type: string }
        mfa_required: { type: boolean }
        preview: { type: boolean }
        users_total: { type: integer }
        users_enrolled: { type: integer }
        users_obligated: { type: integer }
        users_in_grace: { type: integer }
        users_enforced: { type: integer }
        users_exempt: { type: integer }

    MfaExemption:
      type: object
      description: >
        REQ-AUTH-003 (1.3b), funcional.md §D.4.6-§D.4.8, api.md §D.4.
        Recurso común a los tres endpoints de `/mfa-exemptions`. `state`
        es derivado (nunca una columna): `live` (`revoked_at` nulo y
        `expires_at` futuro), `expired` (`revoked_at` nulo y `expires_at`
        pasado), `revoked` (`revoked_at` informado).
      properties:
        public_id: { $ref: '#/components/schemas/PublicId' }
        user:
          type: object
          description: Solo campos públicos — nunca secretos ni estado de factores.
          properties:
            public_id: { $ref: '#/components/schemas/PublicId' }
            given_name: { type: string }
            family_name_1: { type: string }
            family_name_2: { type: string }
            email: { type: string }
        reason: { type: string }
        expires_at: { type: string, format: date-time }
        state: { type: string, enum: [live, expired, revoked] }
        granted_by:
          type: object
          properties:
            public_id: { $ref: '#/components/schemas/PublicId' }
            given_name: { type: string }
            family_name_1: { type: string }
        granted_at: { type: string, format: date-time, description: 'created_at renombrado: cuándo se concedió.' }
        revoked_by:
          type: object
          nullable: true
          properties:
            public_id: { $ref: '#/components/schemas/PublicId' }
            given_name: { type: string }
            family_name_1: { type: string }
        revoked_at: { type: string, format: date-time, nullable: true }

    MfaComplianceUserRow:
      type: object
      description: >
        REQ-AUTH-003 (1.3), api.md §C.5. Fila de
        `GET /mfa-compliance/users` — restaurado en 1.3 el 2026-08-27.
        `user` lleva solo campos públicos; nunca secretos, hashes ni
        recuento de códigos de respaldo restantes (permisos.md §C.6.1).
      properties:
        user:
          type: object
          properties:
            public_id: { $ref: '#/components/schemas/PublicId' }
            given_name: { type: string, nullable: true }
            family_name_1: { type: string, nullable: true }
            family_name_2: { type: string, nullable: true }
            email: { type: string, format: email }
        state:
          type: string
          description: >
            Valor de la fila — nunca literalmente "obligated" (ese es
            solo un alias de filtro sobre pending+past_deadline).
          enum: [enrolled, exempt, pending, past_deadline]
        grace_deadline_at:
          type: string
          format: date-time
          nullable: true
          description: Solo informado en pending/past_deadline.
        enrolled_methods:
          type: array
          items: { type: string, enum: [totp, email, sms] }
        required_by_roles:
          type: array
          items: { type: string }
          description: code de los roles vivos del usuario que exigen MFA.

    PublicId:
      type: string
      format: ulid
      description: ADR-029. Nunca la clave interna bigint.
      example: "01J8ZZZZZZZZZZZZZZZZZZZZZZ"

    Locale:
      type: string
      enum: [es-ES, en, de, fr]

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPageParam:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    CursorParam:
      name: cursor
      in: query
      description: Opaco y cifrado, emitido por una respuesta anterior. ADR-038 §4.4.
      schema: { type: string }
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    SortParam:
      name: sort
      in: query
      description: Prefijo "-" para descendente. Lista blanca cerrada por endpoint (ADR-038 §5.3).
      schema: { type: string }
    QParam:
      name: q
      in: query
      description: Búsqueda de texto libre. Campos sobre los que busca declarados por endpoint.
      schema: { type: string }
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: ULID generado por el cliente (ADR-038 §8).
      schema: { type: string, format: ulid }

  headers:
    XRequestId:
      description: Generado siempre por el servidor (INV-013). Un valor entrante del cliente se ignora.
      schema: { type: string, format: ulid }
    ContentLanguage:
      description: Idioma resuelto de la respuesta (ADR-038 §11).
      schema: { $ref: '#/components/schemas/Locale' }
    IdempotencyReplayed:
      description: Presente y "true" cuando la respuesta es la repetición de una ejecución anterior (ADR-038 §8.2).
      schema: { type: string, enum: ["true"] }
    RetryAfter:
      description: Segundos a esperar antes de reintentar (429/503).
      schema: { type: integer }

  responses:
    Unauthenticated:
      description: Sin sesión válida (401).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Autenticado, sin el permiso requerido (403).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Inexistente o de otro tenant (404). Nunca confirma la existencia de un recurso ajeno.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Validación de cuerpo o de parámetros (422).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Regla de negocio o transición de estado inválida (409).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: >
        Recurso ya no disponible (410). REQ-AUTH: token de invitación,
        restablecimiento o desbloqueo inexistente, caducado, revocado, ya
        usado o de otro tenant — cuerpo idéntico en todos los casos
        (funcional.md §4.7).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Locked:
      description: >
        Cuenta bloqueada por intentos fallidos (423, REQ-AUTH-001).
        Respuesta idéntica exista o no la cuenta detrás del correo
        (RN-AUTH-15, api.md §1.1).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Límite de tasa excedido (429). operacion.md §6, ADR-038 §6.5.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: plataforma-de-gestion-educativa-session
      description: >
        Cookie de sesión httpOnly/Secure/SameSite=Lax, host-only (sin
        atributo Domain — issue #8, RN-AUTH-26), con CSRF vía cabecera
        X-XSRF-TOKEN (ADR-025). Entregada por REQ-AUTH (1.2):
        POST /auth/session la establece, DELETE /auth/session la revoca.
        Nombre real de config('session.cookie') — depende de APP_NAME,
        verificar si ese valor cambia en despliegue.
