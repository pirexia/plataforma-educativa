# REQ-ALUM (pasos 1.15-a y 1.15-b), docs/modulos/REQ-ALUM/api.md §1 y §2. Convenciones de ADR-038.
# `1.15-a`: alumnado (listado, alta, ficha, corrección, baja y restauración). `1.15-b`: matrícula (listado, alta, detalle,
# edición, baja y anulación), ámbito `grupo` y los filtros de matrícula de `GET /students`. La exportación de la lista de
# clase (`1.15-b` T2c), el cambio de grupo y la fotografía (`1.15-c`) se documentan con su entrega.
paths:
  /api/v1/students:
    get:
      operationId: listStudents
      summary: Lista el alumnado
      description: >
        Permiso `alumno.leer`, ámbito `todos` o `unidad_familiar`. Con `unidad_familiar` el listado devuelve solo los
        alumnos con un vínculo **activo** del sujeto (RN-ALUM-62, sin caché entre peticiones, RN-ALUM-63); lo no
        alcanzado no aparece. Paginación por página (defecto 25, máximo 100). Orden por `name` (defecto, nombre visible)
        o `created_at`, desempate por `id`. `q` busca por prefijo de nombre o apellidos (mínimo 2 caracteres) solo entre
        los alumnos del ámbito del sujeto. `include_deleted=true` exige `alumno.eliminar` (si no, `403`). Desde `1.15-b`,
        `course`, `group` y `enrollment_status` filtran a los alumnos con matrícula viva en `academic_year` (por defecto el
        curso activo) que cumpla todos los dados; `academic_year` solo no filtra. Un `academic_year` inexistente, o de un
        curso cerrado sin `curso_historico.leer`, es `404` (RN-ALUM-23); un `course` o `group` que no resuelve a algo de
        ese curso da lista vacía. Esos tres filtros exigen además `matricula.leer` (sin él, `403 alum.validation.filter_forbidden`) y
        solo cuentan las matrículas que el ámbito de ese permiso alcanza.
      tags: ['Alum / Alumnado']
      security: [{ SessionCookie: [] }]
      parameters:
        - name: q
          in: query
          description: Prefijo del nombre o de los apellidos (mínimo 2 caracteres; los comodines de `LIKE` se tratan como texto).
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: include_deleted
          in: query
          description: Incluye los alumnos dados de baja (con `deleted_at`). Solo con `alumno.eliminar`.
          schema: { type: boolean }
        - { name: academic_year, in: query, description: '`public_id` del curso académico (por defecto el activo). Solo filtra combinado con `course`, `group` o `enrollment_status`.', schema: { $ref: '../components.yaml#/components/schemas/PublicId' } }
        - { name: course, in: query, description: '`public_id` del curso de etapa.', schema: { $ref: '../components.yaml#/components/schemas/PublicId' } }
        - { name: group, in: query, description: '`public_id` del grupo.', schema: { $ref: '../components.yaml#/components/schemas/PublicId' } }
        - { name: enrollment_status, in: query, description: 'Estado de la matrícula en el curso.', schema: { $ref: '../components.yaml#/components/schemas/EnrollmentStatus' } }
        - { $ref: '../components.yaml#/components/parameters/StudentSortParam' }
        - { $ref: '../components.yaml#/components/parameters/PageParam' }
        - { $ref: '../components.yaml#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Página de resultados
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/StudentSummary' }
                  meta: { $ref: '../components.yaml#/components/schemas/PageMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`), filtro `include_deleted` sin `alumno.eliminar`, filtro `course`/`group`/`enrollment_status` sin `matricula.leer` o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { description: 'Con `academic_year` inexistente o de un curso cerrado sin `curso_historico.leer`.', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
    post:
      operationId: createStudent
      summary: Da de alta un alumno
      description: >
        Permiso `alumno.crear`, ámbito `todos`. En **una** transacción crea la persona (`Core`), fija su fecha de
        nacimiento e idioma, crea la faceta de alumno y, si llega `family_unit`, la pertenencia a la unidad
        (RN-ALUM-03). Con `family_unit` se exige además `familia.actualizar` (OPEN-ALUM-31 = A, RN-ALUM-04): sin él,
        `403` y no se escribe nada. **`Idempotency-Key` obligatoria** (RN-ALUM-27, ADR-038 §8): ausente o con formato
        inválido ⇒ `400`; el reintento con el mismo cuerpo repite la respuesta original (`Idempotency-Replayed: true`);
        con otro cuerpo, `409`. Un documento que coincide con una persona viva del centro ⇒
        `422 alum.validation.person_exists`, con el mismo cuerpo sea quien sea esa persona (RN-ALUM-09). Una unidad
        familiar inexistente o de otro centro ⇒ `422 alum.validation.family_unit_not_found`.
      tags: ['Alum / Alumnado']
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: '../components.yaml#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components.yaml#/components/schemas/StudentCreate' }
      responses:
        '201':
          description: Alumno creado. Cabecera `Location` con su URL.
          headers:
            Idempotency-Replayed: { $ref: '../components.yaml#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/Student' }
        '400': { description: 'Falta `Idempotency-Key` o no es un ULID (`urn:pge:error:malformed`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso, con `family_unit` sin `familia.actualizar`, o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '409': { $ref: '../components.yaml#/components/responses/Conflict' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/v1/students/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    get:
      operationId: getStudent
      summary: Ficha del alumno
      description: >
        Permiso `alumno.leer`, ámbito `todos` o `unidad_familiar`. Fuera de ámbito o inexistente (o de otro centro):
        `404` idéntico (RN-ALUM-64). Nombres por partes, fecha de nacimiento e idioma de la persona (de `Core`); el
        documento de identidad va **enmascarado**, nunca completo. `enrollments[]` (desde `1.15-b`) lista las matrículas vivas
        del alumno con la forma de `Enrollment`; las de un curso cerrado que el sujeto no puede leer se omiten (RN-ALUM-23). El ámbito de `matricula.leer` acota `enrollments[]`: sin ese permiso sale `[]`.
        Sin `emergency_contact` ni `guardians[]`. Con `has_photo` (booleano; desde `1.15-c`): la URL de la fotografía **no** va en la ficha, solo en `GET /students/{publicId}/photo`.
      tags: ['Alum / Alumnado']
      security: [{ SessionCookie: [] }]
      responses:
        '200':
          description: La ficha
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/Student' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
    patch:
      operationId: updateStudent
      summary: Corrige los datos personales del alumno
      description: >
        Permiso `alumno.actualizar`, ámbito `todos`. Reenvía la corrección a `Core` (con o sin usuario, RN-ALUM-07 y
        RN-ALUM-10), que valida el documento y el idioma, y la audita como cambio de la persona. Solo cuentan las claves
        presentes. Cualquier otra clave (correo de acceso, contraseña, estado del usuario, `family_unit`...) ⇒
        `422 alum.validation.field_not_editable` y no cambia nada. Un cuerpo sin ningún dato ⇒
        `422 alum.validation.no_changes`. El alumno inexistente es `404` antes que cualquier `422`.
      tags: ['Alum / Alumnado']
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components.yaml#/components/schemas/StudentUpdate' }
      responses:
        '200':
          description: La ficha corregida
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/Student' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
    delete:
      operationId: deleteStudent
      summary: Da de baja al alumno
      description: >
        Permiso `alumno.eliminar`, ámbito `todos`. Baja lógica (RN-ALUM-05): no borra la persona ni su pertenencia a la
        unidad familiar. Con alguna matrícula `activa` viva ⇒ `409 alum.conflict.has_active_enrollments` (RN-ALUM-05, desde `1.15-b`).
      tags: ['Alum / Alumnado']
      security: [{ SessionCookie: [] }]
      responses:
        '204': { description: Dado de baja }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components.yaml#/components/responses/Conflict' }

  /api/v1/students/{publicId}/restore:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    post:
      operationId: restoreStudent
      summary: Restaura un alumno dado de baja
      description: >
        Permiso `alumno.eliminar`, ámbito `todos`. Solo si la persona sigue viva y no tiene otra faceta de alumno viva;
        si no, `409 alum.conflict.cannot_restore` (RN-ALUM-06). Un alumno que no está dado de baja es `404`.
      tags: ['Alum / Alumnado']
      security: [{ SessionCookie: [] }]
      responses:
        '200':
          description: Restaurado
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/Student' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components.yaml#/components/responses/Conflict' }

  /api/v1/students/{publicId}/photo:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    put:
      operationId: putStudentPhoto
      summary: Sube o sustituye la fotografía del alumno
      description: >
        Permiso `alumno.actualizar`, ámbito `todos`. `multipart/form-data` con el campo `file`. La imagen se valida y se
        **reprocesa en el servidor** (RN-ALUM-51, ADR-068 §5.3): solo JPEG o PNG por su contenido real (nunca SVG, HEIC ni WebP).
        Todos los rechazos son `422` con el código en `errors.file`: `alum.photo.file_required`, `alum.photo.type_unsupported`,
        `alum.photo.invalid_image` (el contenido no coincide con la extensión, no se puede leer o supera las dimensiones de
        entrada) y `alum.photo.too_large` (5 MB por defecto, `config/alum.php`). Lo que se guarda es una imagen **nueva**
        (orientación EXIF aplicada y descartada, lado mayor <= 1024 px, sin EXIF, XMP, IPTC ni perfiles) en el *bucket* privado bajo
        `tenants/<centro>/alum/student-photos/<ULID>.<ext>`; el original no se guarda. Una fotografía viva por alumno: sustituir da
        de baja la anterior en la misma transacción (RN-ALUM-50). Si el almacenamiento no responde, `503` sin escribir nada.
        Prohibido cualquier tratamiento automatizado de la imagen. Alumno inexistente, de otro centro o dado de baja: `404`
        (antes que cualquier `422`).
      tags: ['Alum / Alumnado']
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: La fotografía queda guardada
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/StudentPhotoStored' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
        '503': { description: 'Almacenamiento no disponible: no se escribe nada (`503`, `Retry-After`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
    get:
      operationId: getStudentPhotoUrl
      summary: URL firmada de la fotografía del alumno
      description: >
        Permiso `alumno.leer`, ámbito `todos`, `grupo` o `unidad_familiar`. Devuelve una URL **firmada de caducidad corta** (5
        minutos por defecto), generada en cada respuesta, con `Cache-Control: no-store`; nunca el binario por la API. **Auditada**
        (`read` sobre la fotografía, sin nombre ni clave de objeto, RN-ALUM-52) antes de devolver la URL y con **límite** de
        lecturas (300 por centro y usuario y hora): superado, `429` con `Retry-After`. Alumno fuera de ámbito, inexistente, de
        otro centro, dado de baja o sin fotografía: `404` idéntico (RN-ALUM-64) y sin fila de lectura.
      tags: ['Alum / Alumnado']
      security: [{ SessionCookie: [] }]
      responses:
        '200':
          description: URL firmada
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/StudentPhotoUrl' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }
    delete:
      operationId: deleteStudentPhoto
      summary: Elimina la fotografía del alumno
      description: >
        Permiso `alumno.actualizar`, ámbito `todos`. Baja lógica de la fotografía viva; el objeto del *bucket* queda para el barrido
        de huérfanos (pendiente, `operacion.md`). Idempotente: sin fotografía también es `204`. Alumno inexistente: `404`.
      tags: ['Alum / Alumnado']
      security: [{ SessionCookie: [] }]
      responses:
        '204': { description: Fotografía dada de baja }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }

  /api/v1/enrollments:
    get:
      operationId: listEnrollments
      summary: Lista las matrículas de un curso académico
      description: >
        Permiso `matricula.leer`, ámbito `todos`, `grupo` o `unidad_familiar`; lo no alcanzado no aparece (RN-ALUM-60,
        RN-ALUM-62). `academic_year` es obligatorio (si falta, `422 alum.validation.required`); un curso inexistente, o
        cerrado sin `curso_historico.leer`, es `404` (RN-ALUM-23). Un `course`, `group` o `student` que no resuelve a nada
        del curso da lista vacía. Orden por `name` (nombre visible del alumno, defecto) o `enrolled_on`, desempate por `id`.
      tags: ['Alum / Matrícula']
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: academic_year, in: query, required: true, description: '`public_id` del curso académico.', schema: { $ref: '../components.yaml#/components/schemas/PublicId' } }
        - { name: course, in: query, description: '`public_id` del curso de etapa.', schema: { $ref: '../components.yaml#/components/schemas/PublicId' } }
        - { name: group, in: query, description: '`public_id` del grupo (lista de clase).', schema: { $ref: '../components.yaml#/components/schemas/PublicId' } }
        - { name: student, in: query, description: '`public_id` del alumno.', schema: { $ref: '../components.yaml#/components/schemas/PublicId' } }
        - { name: status, in: query, schema: { $ref: '../components.yaml#/components/schemas/EnrollmentStatus' } }
        - { $ref: '../components.yaml#/components/parameters/EnrollmentSortParam' }
        - { $ref: '../components.yaml#/components/parameters/PageParam' }
        - { $ref: '../components.yaml#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Página de resultados
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/Enrollment' }
                  meta: { $ref: '../components.yaml#/components/schemas/PageMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
    post:
      operationId: createEnrollment
      summary: Matricula a un alumno
      description: >
        Permiso `matricula.crear`, ámbito `todos`. `group` es opcional (RN-ALUM-20, OPEN-ALUM-11 = B). Sin `Idempotency-Key`:
        el índice único de RN-ALUM-21 convierte el reintento en `422 already_enrolled` (RN-ALUM-27). Curso académico, curso de
        etapa o grupo inexistentes, de otro centro o ilegibles son indistinguibles (RN-ALUM-24). En un curso `cerrado` o
        `archivado`, `409 urn:pge:error:academic-year-closed` (RN-ALUM-23).
      tags: ['Alum / Matrícula']
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components.yaml#/components/schemas/EnrollmentCreate' }
      responses:
        '201':
          description: Matrícula creada. Cabecera `Location` con su URL.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/Enrollment' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '409': { $ref: '../components.yaml#/components/responses/Conflict' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/v1/enrollments/exports:
    post:
      operationId: exportEnrollments
      summary: Solicita la exportación de matrículas o lista de clase (CSV en cola)
      description: >
        Permiso `matricula.exportar`, solo ámbito `todos` (`grupo` no se admite en `1.15`, OPEN-ALUM-18). Genera en cola
        (INV-012) un CSV con el esquema cerrado de api.md §6 (`enrollment_public_id`, `student_public_id`, `family_name`,
        `given_name`, `birth_date`, `academic_year_code`, `course_code`, `group_name`, `status`, `enrolled_on`,
        `withdrawn_on`, `withdrawal_reason`; sin documento de identidad), sobre la primitiva `data_exports` con
        `kind = alum_enrollments`. Cuerpo: los filtros de `GET /enrollments` (`academic_year` obligatorio, `course`,
        `group`, `status`), sin paginación, `sort` ni `q`: con `q`, `422 alum.validation.export_query_not_allowed`
        (ADR-054 §8.2, §9); sin `academic_year`, `422 alum.validation.required`; un curso académico inexistente o
        ilegible, `404` (RN-ALUM-23); más filas que `core.export_max_rows`, `422 core.validation.export_range_too_large`. La solicitud queda auditada como `exported` con los filtros. Límite por centro y
        usuario (10 por hora por defecto, `config/alum.php`): superado, `429` con `Retry-After`. El estado y la descarga,
        en `GET /data-exports/{publicId}`.
      tags: ['Alum / Matrícula']
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [academic_year]
              properties:
                academic_year: { $ref: '../components.yaml#/components/schemas/PublicId' }
                course: { $ref: '../components.yaml#/components/schemas/PublicId' }
                group: { $ref: '../components.yaml#/components/schemas/PublicId' }
                status: { $ref: '../components.yaml#/components/schemas/EnrollmentStatus' }
      responses:
        '202':
          description: Solicitud aceptada, generación en cola
          content:
            application/json:
              schema:
                type: object
                required: [public_id, status]
                properties:
                  public_id: { $ref: '../components.yaml#/components/schemas/PublicId' }
                  status: { type: string, enum: [pendiente, generando, completada, fallida] }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }

  /api/v1/enrollments/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    get:
      operationId: getEnrollment
      summary: Detalle de una matrícula
      description: >
        Permiso `matricula.leer`, ámbito `todos`, `grupo` o `unidad_familiar`. Fuera de ámbito, inexistente, de otro centro o
        de un curso cerrado sin `curso_historico.leer`: `404` idéntico (RN-ALUM-23, RN-ALUM-64).
      tags: ['Alum / Matrícula']
      security: [{ SessionCookie: [] }]
      responses:
        '200':
          description: La matrícula
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/Enrollment' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
    patch:
      operationId: updateEnrollment
      summary: Edita la fecha de matrícula o asigna el primer grupo
      description: >
        Permiso `matricula.actualizar`, ámbito `todos`. Solo `enrolled_on` y `group` (este último solo si la matrícula no
        tiene grupo: cambiarlo es `422 group_change_requires_request`, RN-ALUM-28). `student`, `academic_year` y `course`
        son inmutables: su sola presencia en el cuerpo, aunque coincidan, es `422 alum.validation.immutable`. El `404` va
        antes que cualquier `422`.
      tags: ['Alum / Matrícula']
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components.yaml#/components/schemas/EnrollmentUpdate' }
      responses:
        '200':
          description: La matrícula editada
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/Enrollment' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components.yaml#/components/responses/Conflict' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
    delete:
      operationId: annulEnrollment
      summary: Anula una matrícula creada por error
      description: >
        Permiso `matricula.eliminar`, ámbito `todos`. Borrado lógico (RN-ALUM-25): deja de aparecer en listas y ficha y el
        alumno puede matricularse de nuevo en ese curso. `409 alum.conflict.has_dependents` cuando un consumidor registre
        veto (ninguno en `1.15`). En un curso cerrado, `409 urn:pge:error:academic-year-closed`.
      tags: ['Alum / Matrícula']
      security: [{ SessionCookie: [] }]
      responses:
        '204': { description: Anulada }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components.yaml#/components/responses/Conflict' }

  /api/v1/enrollments/{publicId}/withdrawal:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    post:
      operationId: withdrawEnrollment
      summary: Da de baja una matrícula
      description: >
        Permiso `matricula.actualizar`, ámbito `todos`. La matrícula pasa a `baja` con `withdrawn_on` (no anterior a
        `enrolled_on`) y `withdrawal_reason` del vocabulario (RN-ALUM-22). Sobre una matrícula ya en `baja`
        `409 alum.conflict.already_withdrawn`, también ante el reintento de la misma petición (sin `Idempotency-Key`,
        RN-ALUM-27). En un curso cerrado, `409 urn:pge:error:academic-year-closed`.
      tags: ['Alum / Matrícula']
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components.yaml#/components/schemas/EnrollmentWithdrawal' }
      responses:
        '200':
          description: La matrícula en baja
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/Enrollment' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components.yaml#/components/responses/Conflict' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  # REQ-ALUM (paso 1.15-c, T2a), solicitudes de cambio de grupo (api.md §3).
  /api/v1/group-change-requests:
    get:
      operationId: listGroupChangeRequests
      summary: Lista las solicitudes de cambio de grupo de un curso académico
      description: >
        Permiso `matricula.leer`, ámbito `todos` o `grupo`; con `grupo`, las solicitudes cuya matrícula está en un grupo del
        sujeto, y con `unidad_familiar` ninguna: lista vacía (RN-ALUM-46). `academic_year` es obligatorio (si falta,
        `422 alum.validation.required`); un curso inexistente, o cerrado sin `curso_historico.leer`, es `404` (RN-ALUM-23).
        `group` filtra por grupo de origen o de destino; uno que no resuelve a nada del curso da lista vacía. Orden: la más
        reciente primero, desempate por `id`.
      tags: ['Alum / Matrícula']
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: academic_year, in: query, required: true, description: '`public_id` del curso académico.', schema: { $ref: '../components.yaml#/components/schemas/PublicId' } }
        - { name: status, in: query, schema: { $ref: '../components.yaml#/components/schemas/GroupChangeRequestStatus' } }
        - { name: group, in: query, description: '`public_id` del grupo de origen o de destino.', schema: { $ref: '../components.yaml#/components/schemas/PublicId' } }
        - { $ref: '../components.yaml#/components/parameters/PageParam' }
        - { $ref: '../components.yaml#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Página de resultados
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/GroupChangeRequest' }
                  meta: { $ref: '../components.yaml#/components/schemas/PageMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
    post:
      operationId: createGroupChangeRequest
      summary: Solicita el cambio de grupo de una matrícula
      description: >
        Permiso `matricula.actualizar`, ámbito `todos`. La matrícula debe estar `activa` y con grupo (`422
        alum.validation.enrollment_not_active`, `enrollment_without_group`); el destino, distinto del origen, vivo y del mismo
        curso de etapa (`422 group_not_in_course`, RN-ALUM-40). Con otra solicitud pendiente de la matrícula, `422
        request_already_pending` (RN-ALUM-41). `reason` obligatorio, de 1 a 500 caracteres (`422 reason_invalid`); no se
        registra en la auditoría (RN-ALUM-45). Matrícula inexistente, de otro centro o ilegible: `404`; grupo inexistente o
        ilegible: `422 parent_not_found` (RN-ALUM-24). Sin `Idempotency-Key`: el único de solicitud pendiente protege el
        reintento. En un curso cerrado, `409 urn:pge:error:academic-year-closed`.
      tags: ['Alum / Matrícula']
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components.yaml#/components/schemas/GroupChangeRequestCreate' }
      responses:
        '201':
          description: Solicitud creada en estado `pendiente`. Cabecera `Location` con su URL.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/GroupChangeRequest' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components.yaml#/components/responses/Conflict' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/v1/group-change-requests/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    get:
      operationId: getGroupChangeRequest
      summary: Detalle de una solicitud de cambio de grupo
      description: >
        Permiso `matricula.leer`, ámbito `todos` o `grupo`. Una solicitud fuera de ámbito, de otro centro, inexistente o de un
        curso cerrado ilegible, y cualquiera con `unidad_familiar`, es `404` (RN-ALUM-46, RN-ALUM-64).
      tags: ['Alum / Matrícula']
      security: [{ SessionCookie: [] }]
      responses:
        '200':
          description: La solicitud
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/GroupChangeRequest' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }

  /api/v1/group-change-requests/{publicId}/approval:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    post:
      operationId: approveGroupChangeRequest
      summary: Aprueba una solicitud de cambio de grupo
      description: >
        Permiso `matricula.aprobar`, ámbito `todos`. En una transacción, con la matrícula bloqueada: si sigue `activa` y en el
        grupo de origen, cambia el grupo y cierra la solicitud; si no, `409 alum.conflict.enrollment_changed` y no se escribe
        nada (RN-ALUM-43). El solicitante no puede aprobar la suya: `403 alum.forbidden.self_approval` (RN-ALUM-44). Una solicitud
        ya resuelta: `409 alum.conflict.request_closed` (RN-ALUM-42). `decision_note` opcional, de 1 a 500 caracteres. En un curso
        cerrado, `409 urn:pge:error:academic-year-closed`.
      tags: ['Alum / Matrícula']
      security: [{ SessionCookie: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '../components.yaml#/components/schemas/GroupChangeRequestDecision' }
      responses:
        '200':
          description: La solicitud resuelta
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/GroupChangeRequest' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components.yaml#/components/responses/Conflict' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/v1/group-change-requests/{publicId}/rejection:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    post:
      operationId: rejectGroupChangeRequest
      summary: Rechaza una solicitud de cambio de grupo
      description: >
        Permiso `matricula.aprobar`, ámbito `todos`. `decision_note` **obligatoria**, de 1 a 500 caracteres (`422
        alum.validation.decision_note_required`). El solicitante puede rechazar la suya (RN-ALUM-44). Una solicitud ya
        resuelta: `409 alum.conflict.request_closed` (RN-ALUM-42). No se registra la nota en la auditoría (RN-ALUM-45).
      tags: ['Alum / Matrícula']
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components.yaml#/components/schemas/GroupChangeRequestRejection' }
      responses:
        '200':
          description: La solicitud resuelta
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/GroupChangeRequest' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components.yaml#/components/responses/Conflict' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/v1/group-change-requests/{publicId}/cancellation:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    post:
      operationId: cancelGroupChangeRequest
      summary: Cancela una solicitud de cambio de grupo
      description: >
        Permiso `matricula.actualizar`, ámbito `todos`. Solo una solicitud `pendiente`; `decided_by` es quien cancela, que
        puede ser el solicitante (RN-ALUM-42). Una ya resuelta: `409 alum.conflict.request_closed`. `decision_note` opcional,
        de 1 a 500 caracteres.
      tags: ['Alum / Matrícula']
      security: [{ SessionCookie: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '../components.yaml#/components/schemas/GroupChangeRequestDecision' }
      responses:
        '200':
          description: La solicitud resuelta
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/GroupChangeRequest' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `alum` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components.yaml#/components/responses/Conflict' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
