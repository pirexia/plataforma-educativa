            schema:
              type: object
              properties:
                name_translations: { $ref: '../components.yaml#/components/schemas/TranslationsPatchMap' }
                valid_from: { type: string, format: date, description: 'Solo en un marco `especial`.' }
                valid_to: { type: string, format: date, description: 'Solo en un marco `especial`.' }
                slots:
                  type: array
                  maxItems: 100
                  items: { $ref: '../components.yaml#/components/schemas/TimeSlotPatch' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/TimetableFrame' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409':
          description: '`acad.conflict.has_dependents` (`errors.dependents[0].params.dependents`) o `urn:pge:error:academic-year-closed` (curso de solo lectura).'
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
    delete:
      operationId: deleteTimetableFrame
      summary: Borra (lógico) un marco horario y sus franjas
      description: >
        Permiso `horarios.eliminar`. Un marco con sesiones vivas no se borra (`409 has_dependents` con
        `timetable_sessions`, RN-ACAD-114); si no, se borran lógicamente sus franjas y el marco.
      tags: ['Acad / Horarios']
      security: [{ SessionCookie: [] }]
      responses:
        '204':
          description: Borrado lógico
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409':
          description: '`acad.conflict.has_dependents` (`errors.dependents[0].params.dependents`) o `urn:pge:error:academic-year-closed` (curso de solo lectura).'
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  /api/v1/teaching-assignments:
    get:
      operationId: listTeachingAssignments
      summary: Lista las asignaciones docentes de un curso académico
      description: >
        Permiso `asignacion_docente.leer`. Paginación por página (defecto 25, máximo 100). Orden `id`
        (orden de alta) o `-id`. Filtros `group`, `subject` y `teacher` (varios `public_id` separados por
        coma, combinados con `AND`): un `public_id` inexistente o de otro curso da una colección vacía. El
        filtro `teacher` solo resuelve usuarios activos del centro: un profesor dado de baja no devuelve filas.
      tags: ['Acad / Horarios']
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: '../components.yaml#/components/parameters/AcademicYearFilterParam' }
        - name: group
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '../components.yaml#/components/schemas/PublicId' }
        - name: subject
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '../components.yaml#/components/schemas/PublicId' }
        - name: teacher
          in: query
          description: '`public_id` de usuario.'
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '../components.yaml#/components/schemas/PublicId' }
        - { $ref: '../components.yaml#/components/parameters/TeachingAssignmentSortParam' }
        - { $ref: '../components.yaml#/components/parameters/PageParam' }
        - { $ref: '../components.yaml#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Página de resultados
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/TeachingAssignment' }
                  meta: { $ref: '../components.yaml#/components/schemas/PageMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
    post:
      operationId: createTeachingAssignment
      summary: Crea una asignación docente
      description: >
        Permiso `asignacion_docente.crear`. Un usuario imparte una asignatura que cursa un grupo, con
        subgrupo opcional (RN-ACAD-93). El curso académico es el del grupo: `academic_year` en el cuerpo es
        `422 academic_year_not_allowed`. Errores por campo: `teacher` ⇒ `user_not_found` (inexistente, de otro
        centro o inactivo; no se comprueba ningún rol, RN-ACAD-92) o `assignment_exists` (RN-ACAD-94);
        `group` ⇒ `parent_not_found`; `subject` ⇒ `subject_not_in_group`; `subgroup` ⇒ `subgroup_not_in_group`.
      tags: ['Acad / Horarios']
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teacher, group, subject]
              properties:
                teacher: { $ref: '../components.yaml#/components/schemas/PublicId' }
                group: { $ref: '../components.yaml#/components/schemas/PublicId' }
                subject: { $ref: '../components.yaml#/components/schemas/PublicId' }
                subgroup:
                  nullable: true
                  allOf: [{ $ref: '../components.yaml#/components/schemas/PublicId' }]
      responses:
        '201':
          description: Creado
          headers:
            Location:
              description: URL del recurso creado
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/TeachingAssignment' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '409': { $ref: '../components.yaml#/components/responses/AcademicYearClosed' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/v1/teaching-assignments/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    get:
      operationId: getTeachingAssignment
      summary: Detalle de una asignación docente
      description: >
        Permiso `asignacion_docente.leer`. Un `public_id` de otro centro, o de un curso `cerrado`/`archivado`
        sin `curso_historico.leer`, es `404` (INV-001, RN-ACAD-90). No existe `PATCH`: una asignación es
        inmutable (RN-ACAD-95, `405`).
      tags: ['Acad / Horarios']
      security: [{ SessionCookie: [] }]
      responses:
        '200':
