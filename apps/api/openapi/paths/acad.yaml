  /api/v1/academic-periods:
    get:
      operationId: listAcademicPeriods
      summary: Lista los períodos lectivos de un curso académico
      description: >
        Permiso `configuracion_academica.leer`. Paginación por página (defecto 25, máximo 100).
        Orden por defecto `starts_on`, luego `position`, luego `id`. Filtros combinados con `AND`:
        un `education_level` de otro curso académico distinto del filtrado (o inexistente) da una
        colección vacía. Un `period_type` fuera del vocabulario es `422`.
      tags: ['Acad / Configuración académica']
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: '../components.yaml#/components/parameters/AcademicYearFilterParam' }
        - name: education_level
          in: query
          description: Uno o varios `public_id` de etapa separados por coma.
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '../components.yaml#/components/schemas/PublicId' }
        - name: period_type
          in: query
          description: Uno o varios tipos de período separados por coma (`422` si alguno no es del vocabulario).
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '../components.yaml#/components/schemas/AcademicPeriodType' }
        - { $ref: '../components.yaml#/components/parameters/AcademicPeriodSortParam' }
        - { $ref: '../components.yaml#/components/parameters/PageParam' }
        - { $ref: '../components.yaml#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Página de resultados
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/AcademicPeriod' }
                  meta: { $ref: '../components.yaml#/components/schemas/PageMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
    post:
      operationId: createAcademicPeriod
      summary: Crea un período lectivo
      description: >
        Permiso `configuracion_academica.crear`. La etapa llega en el cuerpo (`education_level`) y el
        curso académico es el de ella: `academic_year` en el cuerpo es `422 acad.validation.academic_year_not_allowed`.
        Etapa ausente, inexistente, borrada, de otro centro o de un curso ilegible: `422 acad.validation.parent_not_found`.
        Reglas de negocio sobre el estado resultante, bajo el bloqueo de RN-ACAD-54: fechas ordenadas
        (`period_ends_before_start`), dentro del curso (`period_outside_academic_year`), un solo tipo por
        etapa (`period_type_mismatch`) y sin solape con otro período vivo de la etapa (`period_overlap`).
        `position` opcional (la última + 1). `name_translations` debe llevar el idioma por defecto del centro.
      tags: ['Acad / Configuración académica']
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [education_level, period_type, name_translations, starts_on, ends_on]
              properties:
                education_level: { $ref: '../components.yaml#/components/schemas/PublicId' }
                period_type: { $ref: '../components.yaml#/components/schemas/AcademicPeriodType' }
                name_translations: { $ref: '../components.yaml#/components/schemas/TranslationsMap' }
                starts_on: { type: string, format: date }
                ends_on: { type: string, format: date }
                position: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Creado
          headers:
            Location:
              description: URL del recurso creado
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/AcademicPeriod' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '409': { $ref: '../components.yaml#/components/responses/AcademicYearClosed' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/v1/academic-periods/{publicId}:
