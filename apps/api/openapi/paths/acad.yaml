                  meta: { $ref: '../components.yaml#/components/schemas/PageMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
    post:
      operationId: createGradingScale
      summary: Crea una escala de calificación con sus valores
      description: >
        Permiso `configuracion_academica.crear`. `academic_year` explícito y obligatorio (RN-ACAD-51): ausente
        ⇒ `422 acad.validation.academic_year_required`; inexistente, de otro centro o de solo lectura sin
        `curso_historico.leer` ⇒ `422 acad.validation.academic_year_not_found` (mismo cuerpo, `S-3`); con
        `curso_historico.leer`, un curso cerrado ⇒ `409 academic-year-closed`. La escala y su lista `values`
        se escriben en una sola transacción (RN-ACAD-80). Reglas por tipo en `GradingScaleCreate`; los
        decimales en `DecimalString`. El campo (`errors.<campo>`) de cada error es el afectado:
        `values.<n>.<campo>` para un elemento (índice base 0 de la lista enviada) y `values` para los de la
        lista entera (`values_required`, `values_too_many`, `passing_value_required`, `bands_not_contiguous`,
        `passing_threshold_inside_band`); `range_invalid` en `max_value`; `passing_out_of_range` en
        `passing_min_value`; `band_range_invalid` en `values.<n>.range_min` o `values.<n>.range_max`
        (contrato fijado por la implementación de `1.11d-b`). Una carrera por el `code` es
        `422 acad.validation.code_taken`, nunca `500`.
      tags: ['Acad / Configuración académica']
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components.yaml#/components/schemas/GradingScaleCreate' }
      responses:
        '201':
          description: Creada
          headers:
            Location:
              description: URL del recurso creado
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/GradingScale' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '409': { $ref: '../components.yaml#/components/responses/AcademicYearClosed' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/v1/grading-scales/{publicId}:
    parameters:
