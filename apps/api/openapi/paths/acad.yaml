        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
    patch:
      operationId: updateGradingScale
      summary: Edita una escala de calificación y, si llega, el conjunto completo de sus valores
      description: >
        Permiso `configuracion_academica.actualizar` (también cuando llega `values`). `values`, si llega, es
        el **conjunto completo** resultante (RN-ACAD-88): elemento con `public_id` ⇒ actualiza ese valor;
        sin `public_id` ⇒ alta; valor vivo ausente ⇒ borrado lógico; el orden de la lista es el nuevo
        `position`. Orden de aplicación: borrados, actualizaciones, altas; todo en una transacción. Las
        reglas se evalúan sobre el estado resultante, también las de los tramos guardados si solo cambian
        campos numéricos. `scale_type` ⇒ `422 acad.validation.scale_type_immutable`; `academic_year` ⇒
        `422 acad.validation.parent_immutable`. Sin cambios efectivos: `200` sin escritura ni auditoría.
