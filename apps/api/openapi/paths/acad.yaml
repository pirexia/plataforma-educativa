  /api/v1/timetable-frames:
    get:
      operationId: listTimetableFrames
      summary: Lista los marcos horarios de un curso académico
      description: >
        Permiso `horarios.leer`. Paginación por página (defecto 25, máximo 100). Orden fijo por etapa
        (posición), `frame_type` e `id`. Filtros combinados con `AND`: un `education_level` de otro curso
        académico (o inexistente) da una colección vacía.
      tags: ['Acad / Horarios']
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: '../components.yaml#/components/parameters/AcademicYearFilterParam' }
        - name: education_level
          in: query
          description: Uno o varios `public_id` de etapa separados por coma.
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '../components.yaml#/components/schemas/PublicId' }
        - name: frame_type
          in: query
          description: Uno o varios tipos separados por coma (`422` si alguno no es del vocabulario).
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '../components.yaml#/components/schemas/TimetableFrameType' }
        - { $ref: '../components.yaml#/components/parameters/TimetableFrameSortParam' }
        - { $ref: '../components.yaml#/components/parameters/PageParam' }
        - { $ref: '../components.yaml#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Página de resultados
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/TimetableFrame' }
                  meta: { $ref: '../components.yaml#/components/schemas/PageMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
    post:
      operationId: createTimetableFrame
      summary: Crea un marco horario (ordinario o especial) con sus franjas
      description: >
        Permiso `horarios.crear`. La etapa llega en el cuerpo (`education_level`) y el curso académico es el
        de ella: `academic_year` en el cuerpo es `422 acad.validation.academic_year_not_allowed`. Etapa
        inexistente, borrada, de otro centro o de un curso ilegible: `422 acad.validation.parent_not_found`.
        `frame_type` obligatorio, `ordinaria` o `especial` (otro valor: `422 frame_type_invalid`). Un `ordinaria`
        no lleva fechas (`422 frame_dates_invalid`) y como mucho hay uno vivo por etapa
        (`422 acad.validation.frame_ordinary_exists`). Un `especial` (jornada intensiva, RN-ACAD-111) lleva
        `valid_from` y `valid_to` (`AAAA-MM-DD`, `valid_to ≥ valid_from`): ausentes o `valid_to < valid_from` ⇒
        `422 frame_dates_invalid`, formato ⇒ `422 date_invalid`, fuera del curso ⇒
        `422 frame_outside_academic_year` (`params.academic_year_starts_on/ends_on`), solapado con otro especial
        vivo de la misma etapa ⇒ `422 frame_overlap` (`params.frame`). `slots`
        opcional (conjunto completo, máximo 100): errores en `slots.<n>.<campo>` (`weekday_invalid`,
        `time_invalid`, `slot_ends_before_start`, `slot_overlap`) y `slots_too_many` en `slots`. El alta
        del primer marco de un curso crea su ancla de horario (RN-ACAD-115).
      tags: ['Acad / Horarios']
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [education_level, frame_type, name_translations]
              properties:
                education_level: { $ref: '../components.yaml#/components/schemas/PublicId' }
                frame_type: { $ref: '../components.yaml#/components/schemas/TimetableFrameType' }
                name_translations: { $ref: '../components.yaml#/components/schemas/TranslationsMap' }
                valid_from: { type: string, format: date, description: 'Solo `especial` (obligatoria en él).' }
                valid_to: { type: string, format: date, description: 'Solo `especial` (obligatoria en él).' }
                slots:
                  type: array
                  maxItems: 100
                  items: { $ref: '../components.yaml#/components/schemas/TimeSlotCreate' }
      responses:
        '201':
          description: Creado
          headers:
            Location:
              description: URL del recurso creado
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/TimetableFrame' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '409': { $ref: '../components.yaml#/components/responses/AcademicYearClosed' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/v1/timetable-frames/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    get:
      operationId: getTimetableFrame
      summary: Detalle de un marco horario con sus franjas
      description: >
        Permiso `horarios.leer`. Un `public_id` de otro centro, o de un curso `cerrado`/`archivado` sin
        `curso_historico.leer`, es `404` (INV-001, RN-ACAD-90).
      tags: ['Acad / Horarios']
      security: [{ SessionCookie: [] }]
      responses:
        '200':
          description: El recurso
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/TimetableFrame' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
    patch:
      operationId: updateTimetableFrame
      summary: Edita un marco horario y/o sincroniza sus franjas
      description: >
        Permiso `horarios.actualizar`. Editables `name_translations` (fusión por idioma) y `slots` como
        conjunto completo sincronizado por `public_id` (RN-ACAD-113: con `public_id` actualiza, sin él da de
        alta, ausente se borra). Una franja con sesiones vivas no se borra ni cambia de día u hora
        (`409 acad.conflict.has_dependents` con `timetable_sessions`, RN-ACAD-114). `education_level` o
        `academic_year` ⇒ `422 parent_immutable`; `frame_type` ⇒ `422 frame_type_immutable`. En un marco
        `especial`, `valid_from` y `valid_to` (RN-ACAD-111): las mismas validaciones que el alta
        (`frame_dates_invalid` también si se envía `null`, `frame_outside_academic_year`, `frame_overlap`) y, si
        el marco tiene sesiones, `422 timetable_conflict` en `valid_from` con `params.conflicts` cuando las
        fechas nuevas hacen coexistir sesiones en conflicto (RN-ACAD-124, `-125`). En un `ordinaria`, una fecha
        no nula ⇒ `422 frame_dates_invalid`.
      tags: ['Acad / Horarios']
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
