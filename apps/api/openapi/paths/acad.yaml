  /api/v1/timetable-sessions:
    get:
      operationId: listTimetableSessions
      summary: Vista semanal de sesiones por profesor, aula, grupo o asignatura
      description: >
        Permiso `horarios.leer`. Exige al menos uno de `teacher`, `facility`, `group`, `subject`
        (`422 acad.validation.view_filter_required`, RN-ACAD-127); `frame` es opcional. La vista de grupo
        incluye las sesiones de sus subgrupos; la de asignatura, las de esa asignatura en todos los grupos.
        Sin paginar, orden fijo `weekday`, `starts_at`, `id`, tope de 500 filas
        (`422 acad.validation.view_too_large`). Un `public_id` inexistente o de otro curso da una colección
        vacía; `teacher` solo resuelve usuarios activos.
      tags: ['Acad / Horarios']
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: '../components.yaml#/components/parameters/AcademicYearFilterParam' }
        - name: teacher
          in: query
          description: '`public_id` de usuario.'
          schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
        - name: facility
          in: query
          schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
        - name: group
          in: query
          schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
        - name: subject
          in: query
          schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
        - name: frame
          in: query
          schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
      responses:
        '200':
          description: Sesiones de la vista
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/TimetableSession' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
    post:
      operationId: createTimetableSession
      summary: Crea una sesión de horario
      description: >
        Permiso `horarios.crear`. Sesión = franja + asignación docente + aula opcional (RN-ACAD-120). El
        curso es el de la franja. Errores: `time_slot` ⇒ `parent_not_found` o `slot_not_for_group` (la etapa
        del grupo no es la del marco); `teaching_assignment` ⇒ `parent_not_found`; `facility` ⇒
        `facility_not_found` o `facility_not_room`; y `time_slot` ⇒ `timetable_conflict` con
        `params.conflicts: [{kind, session}]` (`kind` ∈ `teacher`, `facility`, `group`, RN-ACAD-123), sin
        escribir nada. Toda escritura de sesiones se serializa por curso (RN-ACAD-125).
      tags: ['Acad / Horarios']
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [time_slot, teaching_assignment]
              properties:
                time_slot: { $ref: '../components.yaml#/components/schemas/PublicId' }
                teaching_assignment: { $ref: '../components.yaml#/components/schemas/PublicId' }
                facility:
                  nullable: true
                  allOf: [{ $ref: '../components.yaml#/components/schemas/PublicId' }]
      responses:
        '201':
          description: Creado
          headers:
            Location:
              description: URL del recurso creado
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/TimetableSession' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '409': { $ref: '../components.yaml#/components/responses/AcademicYearClosed' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/v1/timetable-sessions/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    get:
      operationId: getTimetableSession
      summary: Detalle de una sesión de horario
      description: >
        Permiso `horarios.leer`. Un `public_id` de otro centro, o de un curso `cerrado`/`archivado` sin
        `curso_historico.leer`, es `404`. Un aula dada de baja de un curso cerrado se lee con
        `facility.deleted: true` (RN-ACAD-102).
      tags: ['Acad / Horarios']
      security: [{ SessionCookie: [] }]
      responses:
        '200':
          description: El recurso
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/TimetableSession' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
    patch:
      operationId: updateTimetableSession
      summary: Mueve una sesión de franja o cambia su aula
      description: >
        Permiso `horarios.actualizar`. Editables `time_slot` y `facility` (`null` quita el aula, RN-ACAD-122).
        `teaching_assignment` y `academic_year` ⇒ `422 parent_immutable`. Las mismas validaciones y el mismo
        `422 timetable_conflict` que el alta; si choca, la sesión no se mueve.
      tags: ['Acad / Horarios']
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                time_slot: { $ref: '../components.yaml#/components/schemas/PublicId' }
                facility:
                  nullable: true
                  allOf: [{ $ref: '../components.yaml#/components/schemas/PublicId' }]
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/TimetableSession' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components.yaml#/components/responses/AcademicYearClosed' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
    delete:
      operationId: deleteTimetableSession
      summary: Borra (lógico) una sesión de horario
      description: Permiso `horarios.eliminar`.
      tags: ['Acad / Horarios']
      security: [{ SessionCookie: [] }]
      responses:
        '204':
          description: Borrado lógico
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components.yaml#/components/responses/AcademicYearClosed' }

  /api/v1/facility-bookings:
    get:
      operationId: listFacilityBookings
      summary: Lista las reservas de espacios de un curso académico
      description: >
        Permiso `reservas.leer` (ámbito `todos`). Paginación por página (defecto 25, máximo 100). Orden fijo
        `booked_on`, `starts_at`, `id`. Filtros combinados con `AND`: `facility` (varios `public_id` separados
        por coma; uno inexistente o de otro centro no coincide con nada), `booked_from` y `booked_to`
        (`AAAA-MM-DD`, inclusivas; formato inválido ⇒ `422`).
      tags: ['Acad / Reservas']
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: '../components.yaml#/components/parameters/AcademicYearFilterParam' }
        - name: facility
          in: query
          description: Uno o varios `public_id` de espacio separados por coma.
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '../components.yaml#/components/schemas/PublicId' }
        - name: booked_from
          in: query
          schema: { type: string, format: date }
        - name: booked_to
          in: query
          schema: { type: string, format: date }
        - { $ref: '../components.yaml#/components/parameters/PageParam' }
        - { $ref: '../components.yaml#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Página de resultados
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/FacilityBooking' }
                  meta: { $ref: '../components.yaml#/components/schemas/PageMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
    post:
      operationId: createFacilityBooking
      summary: Reserva un espacio en una fecha y un intervalo horario
      description: >
        Permiso `reservas.crear`. Es el único alta de `1.12` con `academic_year` en el cuerpo (una reserva no
        tiene padre con curso, RN-ACAD-140): inexistente o ilegible ⇒ `422 academic_year_not_found`. La fecha
        `booked_on` debe caer dentro del curso (`422 booking_outside_academic_year`, con
        `params.academic_year_starts_on/ends_on`). `facility` (aula o recurso, vivo) inexistente ⇒
        `422 facility_not_found`. Horas `HH:MM` (`422 time_invalid`), `ends_at > starts_at`
        (`422 slot_ends_before_start`). Conflicto ⇒ `422 booking_conflict` en `booked_on` con
        `params.conflicts: [{kind: "booking", booking} | {kind: "session", session}]` (otra reserva del mismo
        espacio que se corta; si es un aula, una sesión del marco vigente ese día que se corta, RN-ACAD-141),
        sin escribir nada. El reservante es quien la crea. Sin repetición ni aprobación (OPEN-ACAD-41).
        Toda escritura se serializa por curso (RN-ACAD-125).
      tags: ['Acad / Reservas']
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [academic_year, facility, booked_on, starts_at, ends_at]
              properties:
                academic_year: { $ref: '../components.yaml#/components/schemas/PublicId' }
                facility: { $ref: '../components.yaml#/components/schemas/PublicId' }
                booked_on: { type: string, format: date, example: "2026-11-12" }
                starts_at: { $ref: '../components.yaml#/components/schemas/CivilTime' }
                ends_at: { $ref: '../components.yaml#/components/schemas/CivilTime' }
      responses:
        '201':
          description: Creado
          headers:
            Location:
              description: URL del recurso creado
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/FacilityBooking' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '409': { $ref: '../components.yaml#/components/responses/AcademicYearClosed' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/v1/facility-bookings/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    get:
      operationId: getFacilityBooking
      summary: Detalle de una reserva de espacio
      description: >
        Permiso `reservas.leer`. Un `public_id` de otro centro, o de un curso `cerrado`/`archivado` sin
        `curso_historico.leer`, es `404`.
      tags: ['Acad / Reservas']
      security: [{ SessionCookie: [] }]
      responses:
        '200':
          description: El recurso
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/FacilityBooking' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'Sin el permiso (`403`) o módulo `acad` no contratado (`403 urn:pge:error:module-disabled`).', content: { application/problem+json: { schema: { $ref: '../components.yaml#/components/schemas/Problem' } } } }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
    delete:
