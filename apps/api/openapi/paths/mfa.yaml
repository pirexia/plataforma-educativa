# REQ-AUTH-003 (paso 1.3). Convenciones transversales en
# docs/adr/ADR-038-convenciones-api-rest.md. Todos los endpoints bajo
# /api/v1, referenciados desde apps/api/openapi.yaml. Contrato completo en
# docs/modulos/REQ-AUTH/api.md §C.
#
# api.md §C.1/§C.5: diez endpoints — siete de autoservicio (por
# identidad, sin permiso, salvo los dos de login en dos pasos que van sin
# sesión) y tres de administración (mfa.leer × 2, mfa.eliminar × 1).
# GET /mfa-compliance/users se restauró en 1.3 el 2026-08-27 (api.md
# §C.1). Ninguno lleva module-enabled (RN-AUTH-35, CA-AUTH-145). El
# undécimo endpoint de este paso, PATCH /api/v1/roles/{publicId} acotado
# a mfa_required, vive en core.yaml (REQ-CORE es dueño del recurso,
# §C.2.2).

paths:
  /api/v1/auth/mfa-enrollments:
    post:
      operationId: createMfaEnrollment
      summary: Alta de un factor MFA (provisional, sin confirmar)
      description: >
        funcional.md §C.4.1, §D.4.1 (1.3b). TOTP y `email` implementados;
        `sms` sigue rechazado (RN-AUTH-69, sin proveedor). El secreto en
        base32 y la URI otpauth de TOTP, o el destino enmascarado de
        `email`, salen del servidor UNA SOLA VEZ, en esta respuesta
        (RN-AUTH-55/75). Sin permiso — por identidad del portador de la
        cookie.
      tags: [Auth / MFA]
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [totp, email, sms] }
      responses:
        '201':
          description: Alta provisional creada.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/MfaEnrollment' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '409':
          description: Ya existe un factor confirmado de ese método (funcional.md §C.4.1 punto 2).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }

  /api/v1/auth/mfa-factors:
    post:
      operationId: createMfaFactor
      summary: Confirma un alta provisional con un código válido
      description: >
        funcional.md §C.4.1 puntos 5-11, §D.4.1 (1.3b). RN-AUTH-59: quinto
        intento fallido, el alta queda muerta (410 a partir de entonces).
        Ramifica por el método del alta: contra el secreto en TOTP,
        contra el hash del código entregado en un método de entrega — un
        código correcto pero caducado responde 422, igual que uno
        incorrecto. Si es el primer factor confirmado del usuario,
        devuelve también los códigos de respaldo en claro (RN-AUTH-56,
        una sola vez).
      tags: [Auth / MFA]
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollment, code]
              properties:
                enrollment: { $ref: '../components.yaml#/components/schemas/PublicId' }
                code: { type: string, example: "123456" }
      responses:
        '201':
          description: Factor confirmado.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/MfaFactorConfirmation' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '410':
          description: Alta inexistente, ajena o vencida — mismo cuerpo en los tres casos (CA-AUTH-107).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/v1/auth/mfa-factors/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    delete:
      operationId: deleteMfaFactor
      summary: Desactiva un factor confirmado del propio usuario
      description: >
        funcional.md §C.4.6. Exige la contraseña actual en el cuerpo
        (mismo argumento que la regeneración de códigos de respaldo).
        RN-AUTH-61: 409 si es el último factor utilizable y algún rol
        del usuario exige MFA sin excepción viva.
      tags: [Auth / MFA]
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password: { type: string }
      responses:
        '204':
          description: Factor desactivado (borrado lógico).
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409': { $ref: '../components.yaml#/components/responses/Conflict' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/v1/auth/mfa:
    get:
      operationId: getMfaStatus
      summary: Estado MFA completo del propio usuario
      description: >
        funcional.md §C.4.3 punto 7, §C.4.8, §D.2.4. Factores confirmados
        (nunca el secreto ni ningún hash), destino enmascarado de los de
        entrega, métodos que admite el tenant, códigos de respaldo
        restantes, bloque de obligación/gracia y caducidad de la
        excepción propia si la hay (1.3b, api.md §D.3.1) — la pantalla de
        /cuenta/seguridad (§C.11).
      tags: [Auth / MFA]
      security: [{ SessionCookie: [] }]
      responses:
        '200':
          description: Estado del usuario autenticado.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/MfaStatus' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }

  /api/v1/auth/mfa-recovery-codes:
    post:
      operationId: createMfaRecoveryCodes
      summary: Regenera el lote de códigos de respaldo
      description: >
        funcional.md §C.4.3 punto 4. Exige la contraseña actual
        (RN-AUTH-60). Sustituye el lote entero — los códigos anteriores,
        usados o no, dejan de funcionar. En claro, una sola vez.
      tags: [Auth / MFA]
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password: { type: string }
      responses:
        '201':
          description: Lote nuevo generado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string, example: "A3F7K-9QRT2" }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }

  /api/v1/auth/mfa-challenges:
    get:
      operationId: getMfaChallenge
      summary: El desafío en curso de la sesión — estrictamente de lectura
      description: >
        REQ-AUTH-002 (1.4), api.md §E.5b. Añadido sobre este recurso de
        1.3 porque el *callback* federado (`GET /auth/oauth/google/callback`)
        no puede llevar datos en su `302` (RN-AUTH-93): la pantalla
        `/entrar/google` necesita esta lectura para pintar el segundo
        factor. También sirve al login local, que recupera aquí lo que
        pierde al recargar `/entrar` a mitad del segundo paso — sin
        cambiar el contrato del `202` de `POST /auth/session`. Mismo
        mecanismo de autorización que el `POST` de abajo (por
        `session_id`, RN-AUTH-53). A diferencia del `POST`: no genera
        código, no encola correo, no toca `attempts`/`deliveries` ni
        prolonga `expires_at` (CA-AUTH-239). `Cache-Control: no-store`
        obligatorio.
      tags: [Auth / OAuth]
      security: []
      responses:
        '200':
          description: Mismo recurso que el 202 de POST /auth/session (con destination_masked, §D.3).
          headers:
            Cache-Control:
              schema: { type: string, enum: ['no-store'] }
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/MfaChallenge' }
        '410':
          description: >
            Sin desafío vivo para esta sesión — inexistente, caducado,
            consumido, con los intentos agotados o de otra sesión. Cuerpo
            idéntico en los cinco casos (RN-AUTH-53). **Nunca 401**:
            entre el paso 1 y el paso 2 no hay identidad que reclamar
            (RN-AUTH-52).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '503':
          description: Tenant suspendido (ResolveTenant).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
    post:
      operationId: createMfaChallenge
      summary: Cambia el método del desafío en curso o reenvía el código
      description: >
        funcional.md §C.4.4.1, §D.4.3 (1.3b). Sin sesión autenticada
        (§C.6): el titular se resuelve por el session_id de la sesión
        anónima con el desafío vivo (RN-AUTH-53), nunca por un
        identificador en el cuerpo. No reinicia el contador de intentos
        ni la caducidad (RN-AUTH-54). Pedir el método en el que ya se
        está **es** el reenvío: genera un código nuevo y lo encola
        (RN-AUTH-79); superado `AUTH_MFA_MAX_DELIVERIES` (3 por desafío)
        responde 429 con `Retry-After`, sin generar código y sin matar el
        desafío. Cambiar a `totp` no consume ninguna entrega.
      tags: [Auth / MFA]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [totp, email, sms] }
      responses:
        '200':
          description: Desafío actualizado.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/MfaChallenge' }
        '410':
          description: Sin desafío vivo para esta sesión — inexistente, ajeno o caducado, mismo cuerpo (RN-AUTH-53/72).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }

  /api/v1/auth/mfa-verifications:
    post:
      operationId: createMfaVerification
      summary: Paso 2 del login — verifica el segundo factor
      description: >
        funcional.md §C.4.4 puntos 6-11. Sin sesión autenticada (§C.6):
        exactamente uno de code/recovery_code. Éxito ⇒ mismo recurso que
        GET /me, identificador de sesión regenerado (RN-AUTH-32). Fallo
        ⇒ 401 genérico, cuenta hacia el mismo bloqueo que la contraseña
        (RN-AUTH-64) y puede terminar en 423 en el siguiente
        POST /auth/session.
      tags: [Auth / MFA]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, example: "123456" }
                recovery_code: { type: string, example: "A3F7K-9QRT2" }
      responses:
        '200':
          description: Login completado. Mismo recurso que GET /me.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/User' }
        '401':
          description: Código incorrecto — genérico, no distingue TOTP de código de respaldo (RN-AUTH-72).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '410':
          description: Sin desafío vivo para esta sesión — inexistente, ajeno, caducado o ya consumido, mismo cuerpo (RN-AUTH-53/54/72).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }

  /api/v1/mfa-compliance:
    get:
      operationId: getMfaCompliance
      summary: Vista previa de usuarios afectados y estado de cumplimiento de un rol
      description: >
        funcional.md §C.1.1 punto 9, CA-AUTH-136. Sin `mfa_required` en
        la query ⇒ estado real del rol. Con `mfa_required` ⇒ vista
        previa hipotética, sin escribir nada — el mismo endpoint
        resuelve las dos peticiones del requisito. Permiso `mfa.leer`.
      tags: [Auth / MFA]
      security: [{ SessionCookie: [] }]
      parameters:
        - name: role
          in: query
          required: true
          description: public_id del rol (REQ-CORE).
          schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
        - name: mfa_required
          in: query
          description: Presente ⇒ vista previa hipotética de ese valor. Ausente ⇒ estado real.
          schema: { type: string, enum: ['0', '1', 'true', 'false'] }
      responses:
        '200':
          description: Resumen de cumplimiento.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/MfaComplianceSummary' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/v1/mfa-compliance/users:
    get:
      operationId: listMfaComplianceUsers
      summary: Listado individualizado de cumplimiento MFA
      description: >
        api.md §C.5. Restaurado en 1.3 el 2026-08-27 (decisión del
        usuario, corrige un recorte no autorizado a 1.3b). Complemento
        individualizado de GET /mfa-compliance. Permiso mfa.leer, el
        mismo que el agregado — no usuario.leer (permisos.md §C.6.1).
      tags: [Auth / MFA]
      security: [{ SessionCookie: [] }]
      parameters:
        - name: state
          in: query
          description: >
            obligated|enrolled|pending|past_deadline|exempt, varios
            separados por coma (ADR-038 §5.2). obligated es un alias de
            conveniencia sobre pending+past_deadline: ninguna fila
            individual lleva ese valor.
          schema: { type: string }
        - $ref: '../components.yaml#/components/parameters/PageParam'
        - $ref: '../components.yaml#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Colección paginada por página (catálogo acotado al tenant, ADR-038 §4.2).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/MfaComplianceUserRow' }
                  meta: { $ref: '../components.yaml#/components/schemas/PageMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/v1/mfa-resets:
    post:
      operationId: createMfaReset
      summary: Restablecimiento de MFA por el administrador
      description: >
        funcional.md §C.4.10, RN-AUTH-66. Motivo obligatorio (mínimo 10
        caracteres), auditado con el administrador y el motivo. Borra
        lógicamente todos los factores y códigos del usuario, revoca
        todas sus sesiones (cambio_credencial) y notifica al titular sin
        enlace accionable. RN-AUTH-67: nadie se restablece a sí mismo
        (403), tenga el permiso que tenga. Permiso `mfa.eliminar`.
      tags: [Auth / MFA]
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, reason]
              properties:
                user: { $ref: '../components.yaml#/components/schemas/PublicId' }
                reason: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        '204':
          description: MFA restablecido.
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403':
          description: >
            Sin `mfa.eliminar` (Forbidden genérico), o el administrador
            intenta restablecerse a sí mismo (RN-AUTH-67) — mismo
            estado, cuerpo genérico en los dos casos.
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }

  /api/v1/mfa-exemptions:
    post:
      operationId: createMfaExemption
      summary: Concede una excepción temporal nominal a la obligatoriedad de MFA
      description: >
        funcional.md §D.4.6, RN-AUTH-81/RN-AUTH-82 (1.3b). Cierra la
        obligación abierta del usuario en la misma transacción — si
        estaba contra el muro, deja de estarlo en su siguiente petición.
        Nadie se concede una excepción a sí mismo. Permiso
        `exencion_mfa.crear`.
      tags: [Auth / MFA]
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, reason, expires_at]
              properties:
                user: { $ref: '../components.yaml#/components/schemas/PublicId' }
                reason: { type: string, minLength: 10, maxLength: 1000 }
                expires_at: { type: string, format: date-time, description: Futura y como mucho AUTH_MFA_MAX_EXEMPTION_DAYS (90) por delante. }
      responses:
        '201':
          description: Excepción concedida.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/MfaExemption' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403':
          description: >
            Sin `exencion_mfa.crear` (Forbidden genérico), o el
            administrador intenta concederse la excepción a sí mismo
            (RN-AUTH-81) — mismo estado, mensaje distinto (api.md §D.4).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409':
          description: El usuario ya tiene una excepción viva (RN-AUTH-81).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

    get:
      operationId: listMfaExemptions
      summary: Lista las excepciones temporales del centro
      description: >
        funcional.md §D.4.7. Se solapa a propósito con
        `GET /mfa-compliance/users?state=exempt`: este trae `reason` y
        `granted_by`, aquel no. Permiso `exencion_mfa.leer`.
      tags: [Auth / MFA]
      security: [{ SessionCookie: [] }]
      parameters:
        - name: state
          in: query
          description: live|expired|revoked, varios separados por coma (ADR-038 §5.2).
          schema: { type: string }
        - name: user
          in: query
          description: public_id del usuario, para ver solo sus excepciones.
          schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
        - $ref: '../components.yaml#/components/parameters/PageParam'
        - $ref: '../components.yaml#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Colección paginada — las vivas primero, luego por concesión descendente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/MfaExemption' }
                  meta: { $ref: '../components.yaml#/components/schemas/PageMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/v1/mfa-exemptions/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    delete:
      operationId: deleteMfaExemption
      summary: Revoca una excepción antes de su caducidad
      description: >
        funcional.md §D.4.8, RN-AUTH-83. No borra: escribe
        `revoked_at`/`revoked_by` y conserva la fila (la auditoría
        registra un `updated`, no un `deleted`) y reabre la obligación
        con plazo de gracia completo si el usuario sigue reuniendo las
        condiciones. Un administrador sí puede revocar la suya propia.
        Permiso `exencion_mfa.eliminar`. Sin cuerpo.
      tags: [Auth / MFA]
      security: [{ SessionCookie: [] }]
      responses:
        '204':
          description: Excepción revocada.
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404':
          description: Excepción inexistente, de otro tenant o ya revocada — cuerpo idéntico en los tres casos (RN-AUTH-83).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
