# REQ-AUTH-002 (paso 1.4). Login con Google y fusión de cuentas.
# Convenciones transversales en docs/adr/ADR-038-convenciones-api-rest.md
# — este fichero no las repite, solo las aplica, salvo por la única
# excepción real del módulo: el callback nunca responde problem+json
# (api.md §E.7.1). Contrato completo en docs/modulos/REQ-AUTH/api.md §E.
#
# api.md §E.6: cinco endpoints, ninguno declara permiso (permisos.md
# §E.1) ni lleva module-enabled (RN-AUTH-35). Dos anónimos, uno
# autorizado por posesión de la sesión que arrancó el flujo (el
# callback), dos por identidad del portador.

paths:
  /api/v1/auth/identity-providers:
    get:
      operationId: getAuthIdentityProviders
      summary: Proveedores de identidad externos admitidos por este centro
      description: >
        api.md §E.2, ampliado por api.md §F.6 (1.4b). Anónimo, tenant por
        host. Lo pide la pantalla de login antes de decidir qué botones
        pintar (RN-AUTH-98) — nunca se pintan por una constante del
        cliente. `data: []` con AUTH_OAUTH_DRIVER=none y catálogo vacío
        (el estado de todos los tenants el día del despliegue,
        operacion.md §F.1) no es un error. **La colección deja de ser
        «cero o uno» (1.4) y pasa a ser N** (1.4b): el driver global de
        Google, si lo hay, más los proveedores catalogados y activos del
        tenant. `id` es un identificador **opaco** que la SPA copia tal
        cual en `POST /auth/oauth-authorizations` sin interpretarlo —
        `"google"` para el driver global, o el `public_id` de un
        proveedor catalogado. `display_name_key` solo aparece en la
        entrada de Google (su etiqueta la resuelve la SPA con su propio
        catálogo de 4 idiomas); `display_name` solo en las catalogadas
        (texto del centro, sin traducir — funcional.md §F.9). No sale
        `issuer`, `client_id` ni los dominios admitidos: es un endpoint
        anónimo y publicarlos sería publicar el mapa de integración del
        centro (datos.md §F.10).
      tags: [Auth / OAuth]
      security: []
      responses:
        '200':
          description: Colección de proveedores disponibles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, description: "Identificador opaco: \"google\" o el public_id de un proveedor catalogado." }
                        display_name_key: { type: string, description: "Solo en la entrada de Google." }
                        display_name: { type: string, description: "Solo en proveedores catalogados: texto del centro, sin traducir." }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }

  /api/v1/auth/oauth-authorizations:
    post:
      operationId: createOAuthAuthorization
      summary: Arranca el flujo OAuth2 con PKCE — login o vinculación
      description: >
        api.md §E.3, funcional.md §E.4.1, ampliado por funcional.md §F.4.3
        (1.4b). Anónimo con intent=login; por identidad del portador con
        intent=link (sesión completa, no restringida por el muro de 1.3 —
        no está en su lista blanca). Devuelve la URL de autorización,
        nunca redirige: la escritura queda bajo CSRF (RN-AUTH-29) y el
        servidor no expone ningún endpoint que reciba una URL y mande el
        navegador allí. La `redirect_uri` interna se construye con el
        slug del tenant ya resuelto y el dominio base configurado, nunca
        con la cabecera Host (RN-AUTH-92, CA-AUTH-203). `provider` acepta
        ahora también el `public_id` de un proveedor catalogado (1.4b):
        desconocido, borrado, no activo o sin credencial vigente ⇒ el
        mismo 422 en los cuatro casos, sin distinguirlos (RN-AUTH-101,
        RN-AUTH-102) — este endpoint es anónimo y distinguirlos sería un
        comprobador de qué centros tienen SSO. Sin `public_id` propio en
        la petición: la única credencial del flujo es la cookie de
        sesión.
      tags: [Auth / OAuth]
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, intent]
              properties:
                provider:
                  type: string
                  description: "Identificador opaco: \"google\", o el public_id de un proveedor catalogado (1.4b)."
                intent: { type: string, enum: [login, link] }
      responses:
        '201':
          description: URL de autorización construida. La SPA navega con window.location.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorization_url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        '422':
          description: >
            AUTH_OAUTH_DRIVER=none (estado por defecto, ningún proveedor
            global configurado); provider desconocido, borrado, no
            activo o sin credencial vigente; intent inválido; o
            intent=link sin sesión.
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '403':
          description: >
            Token CSRF ausente o inválido, o (urn:pge:error:mfa-enrollment-required)
            sesión restringida por el muro de 1.3 con intent=link
            (funcional.md §E.4.4 punto 5).
        '419':
          description: Token CSRF ausente o inválido.
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '503':
          description: Tenant suspendido (ResolveTenant).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  /api/v1/auth/oauth/google/callback:
    get:
      operationId: getOAuthGoogleCallback
      summary: Callback de Google — resolución de identidad y sesión
      description: >
        api.md §E.4, §E.7.1. **La única excepción real a ADR-038 de todo
        el módulo**: nunca responde problem+json ni un recurso — siempre
        302, a una ruta de la SPA con, como mucho, un código de resultado
        de una lista cerrada en la cadena de consulta (RN-AUTH-93). Sin
        CSRF: es una navegación de primer nivel que llega desde un
        tercero: su defensa es el `state`, comparado en tiempo constante
        contra el guardado en el payload de la sesión que arrancó el
        flujo (RN-AUTH-91), de un solo uso. Ningún cliente programático
        llama a este endpoint; su único llamante es Google devolviendo a
        una persona.
      tags: [Auth / OAuth]
      security: []
      parameters:
        - name: code
          in: query
          schema: { type: string }
          description: Puesto por Google. Ausente si canceló o si hay error.
        - name: state
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
          description: "Típicamente access_denied (la persona canceló)."
      responses:
        '302':
          description: >
            Siempre. Sin `resultado` en la cadena de consulta: login
            completado, redirige al destino de la SPA. Con `resultado`:
            uno de segundo_factor, alta_mfa_requerida, vinculado,
            sin_cuenta, cuenta_bloqueada, acceso_denegado, ya_vinculado,
            proveedor_ya_vinculado, cancelado, estado_no_valido o
            error_proveedor (api.md §E.4.2) — nunca datos, tokens, el
            `code`, el `state`, un correo ni un `public_id`
            (CA-AUTH-207). Ninguna otra respuesta es posible: ni 4xx ni
            5xx, ni siquiera por límite de tasa excedido (mapea a
            error_proveedor).
          headers:
            Location:
              schema: { type: string, format: uri }

  /api/v1/auth/identities:
    get:
      operationId: getAuthIdentities
      summary: Mis cuentas externas vinculadas
      description: >
        api.md §E.5. Autoservicio puro, por identidad del portador
        (RN-AUTH-73). Funciona con AUTH_OAUTH_DRIVER=none: gestionar un
        vínculo que ya existe no necesita proveedor — un centro que
        apague Google tiene que dejar que sus usuarios vean y retiren
        los vínculos que ya tenían (operacion.md §E.1).
      tags: [Auth / OAuth]
      security: [{ SessionCookie: [] }]
      responses:
        '200':
          description: Como mucho un vínculo por proveedor hoy — sin paginación.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        public_id: { $ref: '../components.yaml#/components/schemas/PublicId' }
                        provider: { type: string, enum: [google, oidc], description: "oidc desde 1.4b (api.md §F.6)." }
                        provider_display_name:
                          type: string
                          description: Solo cuando hay proveedor catalogado detrás (1.4b, CA-AUTH-303). Nunca el subject.
                        email_at_link:
                          type: string
                          description: Enmascarado con el mismo DestinationMasker de 1.3b (§D.4.5). Informativo, nunca se usa para resolver nada.
                        link_method: { type: string, enum: [fusion_automatica, perfil, emparejamiento_sso], description: "emparejamiento_sso desde 1.4b." }
                        linked_at: { type: string, format: date-time }
                        last_login_at: { type: string, format: date-time, nullable: true }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }

  /api/v1/auth/identities/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    delete:
      operationId: deleteAuthIdentity
      summary: Desvincular una cuenta externa
      description: >
        api.md §E.5, funcional.md §E.4.5. Exige la contraseña actual en
        el cuerpo (RN-AUTH-60, mismo criterio que desactivar un factor de
        MFA). Borrado lógico (INV-004): volver a vincular la misma cuenta
        crea una fila nueva, no revive la borrada (CA-AUTH-228). RN-AUTH-96:
        409 si dejara al usuario sin ninguna forma de entrar — inalcanzable
        hoy (`users.password` NOT NULL), escrita para 1.4b.
      tags: [Auth / OAuth]
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password: { type: string }
      responses:
        '204':
          description: Vínculo desvinculado (borrado lógico).
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '404':
          description: >
            Inexistente, ya desvinculado, de otro usuario o de otro
            tenant — cuerpo idéntico en los cuatro casos (RN-AUTH-41,
            ADR-038 §6.4, CA-AUTH-215).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '409': { $ref: '../components.yaml#/components/responses/Conflict' }
        '422':
          description: >
            current_password ausente o incorrecta. No 401: la sesión
            sigue siendo válida. Cuenta hacia el bloqueo de
            (tenant_id, email) (RN-AUTH-96, CA-AUTH-225).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '403':
          description: Token CSRF ausente o inválido.
        '419':
          description: Token CSRF ausente o inválido.
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }
