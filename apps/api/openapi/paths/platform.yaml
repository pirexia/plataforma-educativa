# REQ-BO-007 (paso 1.6). Convenciones transversales en
# docs/adr/ADR-038-convenciones-api-rest.md — este fichero no las repite,
# solo las aplica. Contrato completo en docs/modulos/REQ-BO/api.md.
#
# Issue #175: dieciocho rutas del chasis sin documentar (veintidós
# operaciones — algunas rutas llevan más de un verbo), más
# /admin-invitation-redemptions (issue #173). El issue original estimó
# "doce"; el recuento real sobre routes.php es mayor porque cuenta cada
# verbo HTTP de una misma ruta como operación propia (p. ej. GET/PATCH/
# DELETE /admins/{publicId} son tres), no solo la plantilla de ruta.
#
# Grupo hermano de /api/v1 (api.md §0): servido únicamente bajo el host
# de plataforma (BACKOFFICE_HOST), con guard, cookie de sesión
# (PlatformSessionCookie, ../components.yaml) y tabla de sesión propios.
# Toda ruta de este fichero, sin excepción, puede responder:
#   - 404 PlatformHostMismatch (RN-BO-48) si el Host no es BACKOFFICE_HOST
#   - 403 PlatformIpNotAllowed (RN-BO-06/07) si la IP no está en la lista blanca
# Se documentan una sola vez aquí, no en cada operación (api.md §1.1,
# puestos 1-2 de la pila, antes que sesión y credenciales).
#
# Autenticación: `security: []` en las rutas anónimas (crean/resuelven la
# sesión, o el canje de invitación); `security: [{ PlatformSessionCookie:
# [] }]` en el resto — incluidas las tres de alta de MFA, que solo
# necesitan sesión, sin factor confirmado todavía (RN-BO-05, api.md
# §1.1.1). La capacidad exigida por `require-platform-capability`
# (permisos.md §2-§4) se indica en la descripción de cada operación
# sensible; OpenAPI 3.1 no modela ese sistema de capacidades propio como
# un esquema de seguridad adicional.

paths:
  /api/platform/v1/csrf-cookie:
    get:
      operationId: getPlatformCsrfCookie
      summary: Semilla de la cookie CSRF de plataforma
      description: >
        api.md §2.1. Con límite de tasa desde el primer día (issue #74,
        hallazgo Alta en 1.2, no repetido aquí).
      tags: [Plataforma / Sesión]
      security: []
      responses:
        '204':
          description: Sin cuerpo. Cookies dejadas en la respuesta.
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }

  /api/platform/v1/auth/session:
    post:
      operationId: createPlatformSession
      summary: Login de plataforma — credenciales, nunca sesión plena antes del segundo factor
      description: >
        api.md §2.1, funcional.md §5.1. `200` con `mfa_required: true` si
        falta el segundo paso (`POST /auth/session/mfa`); con
        `mfa_enrollment_required: true` si el administrador no tiene
        factor confirmado — entra sin sesión plena y solo alcanza `/mfa/*`
        (RN-BO-05). `401` con mensaje idéntico para correo inexistente y
        contraseña incorrecta.
      tags: [Plataforma / Sesión]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Credenciales válidas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfa_required: { type: boolean }
                  mfa_enrollment_required: { type: boolean }
        '401':
          description: Credenciales inválidas — mensaje idéntico para usuario inexistente y contraseña incorrecta.
          headers:
            X-Request-Id: { $ref: '../components.yaml#/components/headers/XRequestId' }
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }
    delete:
      operationId: deletePlatformSession
      summary: Cierra la sesión de plataforma en curso
      description: >
        api.md §2.1. Cierra `platform_admin_sessions` (RN-BO), invalida la
        sesión HTTP y regenera el token CSRF. Idempotente: sin sesión
        autenticada, igualmente responde `204` (mismo criterio que
        `DELETE /api/v1/auth/session` de REQ-AUTH).
      tags: [Plataforma / Sesión]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '204':
          description: Sesión cerrada (o ya no había ninguna activa).
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }

  /api/platform/v1/auth/session/mfa:
    post:
      operationId: createPlatformSessionMfa
      summary: Resuelve el desafío TOTP y emite la sesión plena
      description: api.md §2.1. Único paso que emite la sesión con factor ya confirmado.
      tags: [Plataforma / Sesión]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Sesión plena emitida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfa_required: { type: boolean, enum: [false] }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }

  /api/platform/v1/admin-invitation-redemptions:
    post:
      operationId: createPlatformAdminInvitationRedemption
      summary: Canje de la invitación de un administrador de plataforma — fija la contraseña
      description: >
        Issue #173, operacion.md §5 paso 6. Precedente de forma:
        `POST /api/v1/auth/invitation-redemptions` (REQ-AUTH). Anónimo,
        autorizado por posesión del token — el sujeto todavía no tiene
        sesión con la que tener capacidades. **No** abre sesión (mismo
        criterio que RN-AUTH-21): el administrador entra después con
        `POST /auth/session`, donde, sin MFA confirmado, sólo alcanza
        `/mfa/*` (RN-BO-05). No existe todavía un `CA-BO` numerado para
        este endpoint — hueco de especificación reportado en la
        resolución del issue #173, no un contrato inventado aquí.
      tags: [Plataforma / Sesión]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, password_confirmation]
              properties:
                token: { type: string, description: "Token en claro, nunca en la ruta." }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '204':
          description: Contraseña fijada. La invitación queda canjeada; un segundo canje del mismo token responde 410.
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }
        '410': { $ref: '../components.yaml#/components/responses/Gone' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }

  /api/platform/v1/auth/reauthenticate:
    post:
      operationId: createPlatformReauthentication
      summary: Reautenticación para operaciones sensibles (RN-BO-08)
      description: >
        api.md §2.1, §4. Contraseña **y** segundo factor. Marca la sesión
        como reautenticada durante `BO_REAUTH_WINDOW` minutos — estado de
        sesión, no de tabla. A diferencia de las cinco rutas de arriba,
        **exige** sesión con MFA ya superado: no es una excepción de MFA
        (issue #174).
      tags: [Plataforma / Sesión]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string }
      responses:
        '204':
          description: Reautenticado. Auditado como reautenticacion.superada.
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }

  /api/platform/v1/me:
    get:
      operationId: getPlatformMe
      summary: El administrador autenticado y sus roles
      description: api.md §2.1. Sin permiso, por identidad del portador — igual que GET /me en REQ-CORE.
      tags: [Plataforma / Sesión]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '200':
          description: El administrador de la sesión actual.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformAdmin' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }

  /api/platform/v1/mfa/factors:
    post:
      operationId: createPlatformMfaFactor
      summary: Alta del segundo factor TOTP (obligatorio, RN-BO-05)
      description: >
        api.md §2.1. Única vía: sólo TOTP (datos.md §2.4, sin correo como
        segundo factor en el backoffice, a diferencia del tenant).
        Alcanzable con sesión sin MFA confirmado — es, junto con `confirm`
        y `recovery-codes`, la excepción que RN-BO-05 exige.
      tags: [Plataforma / Sesión]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '201':
          description: Factor creado sin confirmar, con su URI otpauth para el generador TOTP.
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_id: { $ref: '../components.yaml#/components/schemas/PublicId' }
                  otpauth_uri: { type: string, format: uri }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }

  /api/platform/v1/mfa/factors/{publicId}/confirm:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    post:
      operationId: confirmPlatformMfaFactor
      summary: Confirma el segundo factor y entrega los códigos de recuperación
      description: >
        api.md §2.1. Los códigos de recuperación en claro se muestran
        **una sola vez**, aquí — GET /mfa/recovery-codes sólo informa el
        recuento sin usar.
      tags: [Plataforma / Sesión]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Factor confirmado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }
                    description: En claro, sólo en esta respuesta. Sólo el hash se persiste.
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }
        '422':
          description: Código incorrecto (bo.mfa.invalid_code), o el factor ya estaba confirmado.
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  /api/platform/v1/mfa/recovery-codes:
    get:
      operationId: listPlatformMfaRecoveryCodes
      summary: Recuento de códigos de recuperación sin usar
      description: >
        api.md §2.1. Nunca el valor de los códigos — sólo se muestran una
        vez, al confirmar el factor.
      tags: [Plataforma / Sesión]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '200':
          description: Recuento.
          content:
            application/json:
              schema:
                type: object
                properties:
                  remaining: { type: integer, minimum: 0 }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }

  /api/platform/v1/admins:
    get:
      operationId: listPlatformAdmins
      summary: Administradores de plataforma
      description: "api.md §2.2. Capacidad `admin.leer` (sólo `superadministrador`, permisos.md §4.1). Filtros status, role, q."
      tags: [Plataforma / Administradores]
      security: [{ PlatformSessionCookie: [] }]
      parameters:
        - name: status
          in: query
          description: Repetible, separado por comas.
          schema: { type: string, enum: [activo, suspendido] }
        - name: q
          in: query
          description: Busca en name/email.
          schema: { type: string }
        - { $ref: '../components.yaml#/components/parameters/PageParam' }
        - { $ref: '../components.yaml#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Página de administradores.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/PlatformAdmin' }
                  meta: { $ref: '../components.yaml#/components/schemas/PageMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }
    post:
      operationId: createPlatformAdmin
      summary: Crea un administrador de plataforma — sin contraseña utilizable, e invita
      description: >
        api.md §2.2, §4. Capacidad `admin.crear` (superadministrador) +
        reautenticación (operación sensible). Crea con contraseña
        aleatoria descartada y despacha, en cola, una invitación real por
        correo — token de un solo uso, canjeable en
        `POST /admin-invitation-redemptions` (issue #173, antes de la
        corrección esta invitación nunca se emitía).
      tags: [Plataforma / Administradores]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, locale, role]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                locale: { $ref: '../components.yaml#/components/schemas/Locale' }
                role: { type: string, enum: [soporte, operaciones, comercial, superadministrador] }
      responses:
        '201':
          description: Administrador creado.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformAdmin' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403':
          description: Sin la capacidad admin.crear, IP no permitida, o sin reautenticación viva (PlatformReauthenticationRequired).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/platform/v1/admins/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    get:
      operationId: getPlatformAdmin
      summary: Un administrador de plataforma
      description: "api.md §2.2. Capacidad admin.leer."
      tags: [Plataforma / Administradores]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '200':
          description: Administrador.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformAdmin' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
    patch:
      operationId: updatePlatformAdmin
      summary: Actualiza nombre e idioma de un administrador
      description: "api.md §2.2. Capacidad admin.actualizar. El correo no se cambia por esta vía."
      tags: [Plataforma / Administradores]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, locale]
              properties:
                name: { type: string }
                locale: { $ref: '../components.yaml#/components/schemas/Locale' }
      responses:
        '200':
          description: Administrador actualizado.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformAdmin' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
    delete:
      operationId: deletePlatformAdmin
      summary: Elimina (borrado lógico) un administrador de plataforma
      description: >
        api.md §2.2, §4. Capacidad admin.eliminar + reautenticación.
        `409` si el actor es el propio sujeto (RN-BO-10) o si deja la
        plataforma sin ningún superadministrador vivo y activo (RN-BO-11).
      tags: [Plataforma / Administradores]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '204':
          description: Eliminado (borrado lógico). Sesiones vivas revocadas.
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403':
          description: Sin la capacidad admin.eliminar, IP no permitida, o sin reautenticación viva.
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409':
          description: El actor es el propio sujeto (RN-BO-10), o dejaría la plataforma sin superadministrador (RN-BO-11).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/platform/v1/admins/{publicId}/roles:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    put:
      operationId: replacePlatformAdminRoles
      summary: Sustituye el conjunto completo de roles de un administrador
      description: >
        api.md §2.2. Capacidad admin.rol.gestionar. Conjunto completo, no
        incremental. Mismos `409` que DELETE /admins/{publicId}
        (RN-BO-10, RN-BO-11).
      tags: [Plataforma / Administradores]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles, reason]
              properties:
                roles:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [soporte, operaciones, comercial, superadministrador] }
                reason: { type: string }
      responses:
        '200':
          description: Roles sustituidos.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformAdmin' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409':
          description: El actor es el propio sujeto (RN-BO-10), o el conjunto nuevo deja la plataforma sin superadministrador (RN-BO-11).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/platform/v1/admins/{publicId}/status:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    post:
      operationId: updatePlatformAdminStatus
      summary: Suspende o reactiva un administrador de plataforma
      description: >
        api.md §2.2, datos.md §2.7. Capacidad admin.actualizar. Suspender
        revoca las sesiones vivas del administrador (no sólo impide que
        vuelva a entrar). Mismos `409` que DELETE /admins/{publicId}.
      tags: [Plataforma / Administradores]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [activo, suspendido] }
                reason: { type: string }
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformAdmin' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409':
          description: El actor es el propio sujeto, o suspenderlo deja la plataforma sin superadministrador (RN-BO-10, RN-BO-11).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/platform/v1/admins/{publicId}/mfa:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    delete:
      operationId: resetPlatformAdminMfa
      summary: Restablece el segundo factor de otro administrador
      description: >
        api.md §2.2, §4, CA-BO-012. Capacidad admin.mfa.restablecer +
        reautenticación. Sensible: **nunca** autoservicio (`409` si el
        actor es el propio sujeto), **nunca** por correo — sólo otro
        superadministrador, por esta vía, con auditoría.
      tags: [Plataforma / Administradores]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '204':
          description: Factor y códigos de recuperación borrados. Sesiones vivas revocadas.
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403':
          description: Sin la capacidad admin.mfa.restablecer, IP no permitida, o sin reautenticación viva.
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409':
          description: El actor intenta restablecerse el MFA a sí mismo (RN-BO-10).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  /api/platform/v1/ip-allowlist:
    get:
      operationId: listPlatformIpAllowlist
      summary: Lista blanca de IP de plataforma
      description: "api.md §2.3. Capacidad ip_allowlist.leer."
      tags: [Plataforma / Lista blanca IP]
      security: [{ PlatformSessionCookie: [] }]
      parameters:
        - { $ref: '../components.yaml#/components/parameters/PageParam' }
        - { $ref: '../components.yaml#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Página de entradas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/PlatformIpAllowlistEntry' }
                  meta: { $ref: '../components.yaml#/components/schemas/PageMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
    post:
      operationId: createPlatformIpAllowlistEntry
      summary: Añade una entrada a la lista blanca de IP
      description: >
        api.md §2.3. Capacidad ip_allowlist.gestionar + reautenticación
        (sensible). RN-BO-06/07: nunca vacía como "sin restricción" —
        cada entrada es explícita, auditada y con autor.
      tags: [Plataforma / Lista blanca IP]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cidr, description]
              properties:
                cidr: { type: string, example: "203.0.113.0/24" }
                description: { type: string }
      responses:
        '201':
          description: Entrada creada.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformIpAllowlistEntry' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403':
          description: Sin la capacidad ip_allowlist.gestionar, IP no permitida, o sin reautenticación viva.
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/platform/v1/ip-allowlist/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    delete:
      operationId: deletePlatformIpAllowlistEntry
      summary: Retira una entrada de la lista blanca de IP
      description: >
        api.md §2.3. Capacidad ip_allowlist.gestionar + reautenticación.
        **No** comprueba si el solicitante se está dejando fuera a sí
        mismo (deliberado: una red corporativa tiene varias salidas; un
        bloqueo total se resuelve por consola en el servidor, RN-BO-07).
      tags: [Plataforma / Lista blanca IP]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '204':
          description: Entrada retirada.
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403':
          description: Sin la capacidad ip_allowlist.gestionar, IP no permitida, o sin reautenticación viva.
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }

  /api/platform/v1/admin-action-logs:
    get:
      operationId: listAdminActionLogs
      summary: Auditoría de plataforma (todas las entradas)
      description: >
        api.md §2.9, §3.2, datos.md §4. Capacidad auditoria_plataforma.leer
        (sin exportar, a propósito — permisos.md §5.4). Corre como
        `plataforma_platform` (BYPASSRLS): ve la tabla entera, a
        diferencia de `GET /api/v1/platform-actions` (REQ-CORE), que un
        centro usa para ver sólo lo que le afecta. Cursor cifrado con el
        `platform_admin_id` del emisor — uno emitido por otra sesión
        responde 422 (bo.validation.cursor_invalid).
      tags: [Plataforma / Auditoría]
      security: [{ PlatformSessionCookie: [] }]
      parameters:
        - name: action
          in: query
          description: Repetible, separado por comas.
          schema: { type: string }
        - name: actor_platform_admin_id
          in: query
          schema: { type: integer }
        - name: affected_tenant_id
          in: query
          schema: { type: integer }
        - name: occurred_at_from
          in: query
          schema: { type: string, format: date-time }
        - name: occurred_at_to
          in: query
          schema: { type: string, format: date-time }
        - { $ref: '../components.yaml#/components/parameters/CursorParam' }
        - { $ref: '../components.yaml#/components/parameters/LimitParam' }
      responses:
        '200':
          description: Página de acciones de plataforma, orden occurred_at DESC.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/AdminActionLog' }
                  meta: { $ref: '../components.yaml#/components/schemas/CursorMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '422':
          description: Cursor inválido, o emitido por otra sesión (api.md §3.2).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  /api/platform/v1/tenants/{publicId}/admin-action-logs:
    parameters:
      - name: publicId
        in: path
        required: true
        description: public_id del tenant.
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    get:
      operationId: listTenantAdminActionLogs
      summary: Auditoría de plataforma que afecta a un centro concreto
      description: >
        api.md §2.9. Capacidad tenant.leer. Mismo mecanismo de cursor que
        `GET /admin-action-logs`, acotado a `affected_tenant_id` del
        tenant indicado.
      tags: [Plataforma / Auditoría]
      security: [{ PlatformSessionCookie: [] }]
      parameters:
        - { $ref: '../components.yaml#/components/parameters/CursorParam' }
        - { $ref: '../components.yaml#/components/parameters/LimitParam' }
      responses:
        '200':
          description: Página de acciones de plataforma sobre ese tenant, orden occurred_at DESC.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/AdminActionLog' }
                  meta: { $ref: '../components.yaml#/components/schemas/CursorMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422':
          description: Cursor inválido, o emitido por otra sesión.
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  # REQ-BO-001 (1.6b). api.md §2.4, §2.4.1 a §2.4.3, §2.5. Inventario y
  # ciclo de vida de tenants.
  /api/platform/v1/tenants:
    get:
      operationId: listPlatformTenants
      summary: Inventario de tenants
      description: >
        api.md §2.4, §3.3. Capacidad tenant.leer. Filtros status, q,
        grace_expired, provisioning, module_code. `autonomous_community`
        **no** se implementa en 1.6b (ver TenantsController::index()):
        la comunidad autónoma vive en `tenant_settings`, tabla interna de
        `REQ-CORE`, y su única interfaz pública no sirve para filtrar
        entre tenants sin ampliar la superficie pública de ese módulo
        fuera de lo que `ADR-048 §10` autorizó. No se documenta un
        parámetro que no hace nada.
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      parameters:
        - name: status
          in: query
          description: Repetible, separado por comas.
          schema: { type: string, enum: [en_alta, activo, suspendido, en_baja, eliminado] }
        - { $ref: '../components.yaml#/components/parameters/QParam' }
        - name: grace_expired
          in: query
          schema: { type: boolean }
        - name: provisioning
          in: query
          schema: { type: string, enum: [en_curso, fallido] }
        - name: module_code
          in: query
          schema: { type: string }
        - { $ref: '../components.yaml#/components/parameters/PageParam' }
        - { $ref: '../components.yaml#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Página de tenants.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/PlatformTenant' }
                  meta: { $ref: '../components.yaml#/components/schemas/PageMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
    post:
      operationId: createPlatformTenant
      summary: Alta de un tenant (en dos fases)
      description: >
        REQ-BO-001, funcional.md §5.3, api.md §2.4.1. Capacidad
        tenant.crear, sensible (reautenticación), `Idempotency-Key`
        obligatoria (ADR-038 §8.1). Fase 1 síncrona: responde `201` con el
        tenant en `en_alta`. Fase 2, en cola (`ProvisionTenant`): aplica
        la configuración inicial, siembra los 16 roles y crea el primer
        Administrador de Centro, invitado.
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      parameters:
        - { $ref: '../components.yaml#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, reason, settings, administrator]
              properties:
                name: { type: string }
                slug: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
                reason: { type: string }
                settings:
                  type: object
                  required: [default_locale, active_locales, timezone, currency, autonomous_community]
                  properties:
                    default_locale: { $ref: '../components.yaml#/components/schemas/Locale' }
                    active_locales:
                      type: array
                      items: { $ref: '../components.yaml#/components/schemas/Locale' }
                    timezone: { type: string, example: Europe/Madrid }
                    currency: { type: string, example: EUR }
                    autonomous_community: { type: string, example: MD }
                administrator:
                  type: object
                  required: [email, given_name, family_name]
                  properties:
                    email: { type: string, format: email }
                    given_name: { type: string }
                    family_name: { type: string }
      responses:
        '201':
          description: Tenant creado, en `en_alta`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '../components.yaml#/components/schemas/PlatformTenant' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformReauthenticationRequired' }
        '422':
          description: "Validación, slug ocupado (bo.tenant.slug_taken) o reservado (bo.tenant.slug_reserved, RN-BO-49)."
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  /api/platform/v1/tenants/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    get:
      operationId: getPlatformTenant
      summary: Ficha de un tenant
      description: "api.md §2.4. Capacidad tenant.leer."
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '200':
          description: El tenant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '../components.yaml#/components/schemas/PlatformTenant' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
    patch:
      operationId: updatePlatformTenant
      summary: Actualiza nombre y/o mensaje de suspensión
      description: "api.md §2.4. Capacidad tenant.actualizar. El `slug` va aparte (POST .../slug)."
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                suspension_message: { type: string, nullable: true }
      responses:
        '200':
          description: Tenant actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '../components.yaml#/components/schemas/PlatformTenant' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/platform/v1/tenants/{publicId}/transitions:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    post:
      operationId: transitionPlatformTenant
      summary: Única puerta de cambio de estado de un tenant
      description: >
        REQ-BO-001, funcional.md §5.4, §5.5, api.md §2.4.2. RN-BO-12: las
        cinco transiciones permitidas y ninguna más. Capacidad exacta
        según origen/destino (permisos.md §4.3): `tenant.suspender`
        (suspender/reactivar), `tenant.baja` (dar de baja/rescatar),
        `tenant.eliminar` (eliminar). Reautenticación exigida solo cuando
        `to_status` ∈ {en_baja, eliminado} (api.md §4).
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_status, reason]
              properties:
                to_status: { type: string, enum: [activo, suspendido, en_baja, eliminado] }
                reason: { type: string }
                suspension_message: { type: string, nullable: true }
                confirmation_name:
                  type: string
                  description: Obligatorio y literal cuando to_status=eliminado (RN-BO-57).
      responses:
        '200':
          description: Transición simple ejecutada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '../components.yaml#/components/schemas/PlatformTenant' }
        '202':
          description: "to_status=eliminado: doble autorización creada y pendiente. No se ha eliminado nada todavía."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '../components.yaml#/components/schemas/DualAuthorization' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformReauthenticationRequired' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409':
          description: "Transición no permitida (bo.tenant.invalid_transition)."
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '422':
          description: "Validación de cuerpo o de parámetros, incluido nombre de confirmación no exacto (bo.tenant.name_mismatch, RN-BO-57)."
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  /api/platform/v1/tenants/{publicId}/lifecycle-events:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    get:
      operationId: listPlatformTenantLifecycleEvents
      summary: Historia de la máquina de estados de un tenant
      description: "api.md §2.4. Capacidad tenant.leer."
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      parameters:
        - { $ref: '../components.yaml#/components/parameters/PageParam' }
        - { $ref: '../components.yaml#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Página de transiciones, orden occurred_at DESC.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/TenantLifecycleEvent' }
                  meta: { $ref: '../components.yaml#/components/schemas/PageMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }

  /api/platform/v1/tenants/{publicId}/clone:
    parameters:
      - name: publicId
        in: path
        required: true
        description: public_id del tenant origen.
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    post:
      operationId: clonePlatformTenant
      summary: Clona un tenant como plantilla
      description: >
        RMT-007, funcional.md §5.6, api.md §2.4.3. Capacidad tenant.crear,
        sensible, `Idempotency-Key` obligatoria. Copia configuración
        operativa, roles y concesiones (nunca personas, usuarios,
        invitaciones ni auditoría — RN-BO-21). El origen no puede estar
        `en_alta` ni `eliminado` (RN-BO-59).
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      parameters:
        - { $ref: '../components.yaml#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, reason, administrator]
              properties:
                name: { type: string }
                slug: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
                reason: { type: string }
                administrator:
                  type: object
                  required: [email, given_name, family_name]
                  properties:
                    email: { type: string, format: email }
                    given_name: { type: string }
                    family_name: { type: string }
      responses:
        '201':
          description: Clon creado, en `en_alta`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '../components.yaml#/components/schemas/PlatformTenantClone' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformReauthenticationRequired' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422':
          description: "Validación, o origen en estado no clonable (bo.tenant.clone_source_invalid, RN-BO-59)."
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  /api/platform/v1/tenants/{publicId}/slug:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    post:
      operationId: changePlatformTenantSlug
      summary: Cambia el slug (dominio) de un tenant
      description: >
        api.md §2.5. Ruta propia, no un campo de `PATCH`: cambia el
        nombre DNS del centro e invalida las dos claves de caché
        (RN-BO-51). Capacidad tenant.actualizar, sensible.
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, reason]
              properties:
                slug: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
                reason: { type: string }
      responses:
        '200':
          description: Slug cambiado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '../components.yaml#/components/schemas/PlatformTenant' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformReauthenticationRequired' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422':
          description: "Validación, slug ocupado o reservado (RN-BO-49)."
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  # REQ-BO-002 (1.6c), ADR-045, funcional.md §5.8, api.md §2.6, §2.7.
  # Contratar y descontratar módulos. Un solo código de error propio para
  # el módulo no contratado, del lado del tenant (urn:pge:error:
  # module-disabled) — no se repite aquí, es de REQ-CORE.
  /api/platform/v1/modules:
    get:
      operationId: listPlatformModules
      summary: Catálogo de módulos declarados
      description: >
        api.md §2.6.1. Capacidad modulo.leer. Sin paginar: son los
        módulos declarados en código, leídos en proceso (ADR-038 §4.2).
        `essential`/`depends_on` salen del descriptor (RN-BO-63), nunca
        de la tabla `modules`; `retired_at` sí sale de ella.
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '200':
          description: Catálogo completo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/PlatformModule' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }

  /api/platform/v1/tenants/{publicId}/modules:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    get:
      operationId: listPlatformTenantModules
      summary: Módulos de un tenant, con su estado
      description: >
        api.md §2.6.2. Capacidad modulo.leer. Los tres estados de
        ADR-045 §4.7 (`no_contratado`, `contratado`, `esencial`) por
        módulo, con la incoherencia de dependencias visible
        (`missing_dependencies`, RN-BO-28, CA-BO-146). `reason` aparece
        aquí (es el backoffice) y no en el `GET /modules` del propio
        centro (RN-BO-82).
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '200':
          description: Estado de módulos del tenant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/PlatformTenantModuleState' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }

  /api/platform/v1/tenants/{publicId}/modules/preview:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    post:
      operationId: previewPlatformTenantModuleChange
      summary: Vista previa de contratar/descontratar un módulo
      description: >
        api.md §2.7, RN-BO-68. No escribe nada y no bloquea nada: la
        ejecución recalcula el cierre dentro de su transacción y puede
        diferir de lo anunciado aquí. Capacidad modulo.leer.
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components.yaml#/components/schemas/PlatformModuleChangeRequest' }
      responses:
        '200':
          description: Cierre de dependencias e impacto estimado.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformModulePreviewResult' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }

  /api/platform/v1/tenants/{publicId}/modules/{moduleCode}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
      - name: moduleCode
        in: path
        required: true
        description: Código estable del módulo (`modules.code`), no una clave interna (ADR-029).
        schema: { type: string }
    put:
      operationId: updatePlatformTenantModule
      summary: Contrata o descontrata un módulo de un tenant
      description: >
        api.md §2.6.3. Capacidad modulo.contratar. Sensible **sólo** con
        `enabled: false` (OPEN-BO-17, RN-BO-08). `cascade` no tiene valor
        por defecto verdadero (RN-BO-67): sin él, un arrastre responde
        409 con la lista exacta. Idempotente por el índice único de
        `module_subscriptions` (RN-BO-69): reintentar no reescribe nada
        ni audita de nuevo.
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, reason]
              properties:
                enabled: { type: boolean }
                reason: { type: string, description: Obligatorio y no vacío (RN-BO-24, bo.module.reason_required). }
                cascade: { type: boolean, default: false }
      responses:
        '200':
          description: >
            Dice qué se hizo de verdad (RN-BO-68), no lo que se pidió.
            `applied` vacío y el módulo en `unchanged` es el resultado
            normal de reintentar (RN-BO-69). `cache_invalidated: false`
            indica que la fase 2 falló (RN-BO-76): la escritura ya está
            confirmada y auditada de todos modos.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformModuleChangeResult' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformReauthenticationRequired' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409':
          description: "Arrastre sin confirmar (bo.module.dependent_modules/missing_dependencies) o estado del tenant que no admite escritura (bo.module.tenant_state_invalid, RN-BO-71)."
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '422':
          description: "Módulo esencial (bo.module.essential, RN-BO-65), retirado al contratar (bo.module.retired, RN-BO-70), o motivo vacío."
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  /api/platform/v1/module-rollouts/preview:
    post:
      operationId: previewPlatformModuleRollout
      summary: Vista previa de una activación/desactivación masiva
      description: >
        api.md §2.7. Agrega la vista previa de cada centro de la lista.
        No escribe ni bloquea nada (RN-BO-68). Capacidad modulo.leer.
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components.yaml#/components/schemas/PlatformModuleRolloutRequest' }
      responses:
        '200':
          description: Cierre agregado e impacto estimado sobre el lote.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformModulePreviewResult' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '422':
          description: "tenant_public_ids vacía, con duplicados o con un public_id inexistente (RN-BO-81)."
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  /api/platform/v1/module-rollouts:
    post:
      operationId: createPlatformModuleRollout
      summary: Activa o desactiva un módulo en varios tenants a la vez
      description: >
        api.md §2.6.4. Capacidad modulo.contratar_masivo, sensible,
        `Idempotency-Key` obligatoria (ADR-038 §8.1, criterios 2 y 3).
        Sin selector por filtro: lista explícita de `public_id`, no
        vacía y sin duplicados (RN-BO-81). Un lote declara una única
        dirección (RN-BO-79). `enabled: true` encola de inmediato
        (`202`, tipo `module_rollout`); `enabled: false` no escribe ni
        encola nada — crea la doble autorización pendiente (`202`, tipo
        `dual_authorization`, `REQ-BO-007`) y sólo se ejecuta al
        aprobarse (`POST /dual-authorizations/{id}/approval`).
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      parameters:
        - { $ref: '../components.yaml#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components.yaml#/components/schemas/PlatformModuleRolloutRequest' }
      responses:
        '202':
          description: Lote encolado, o doble autorización pendiente — ver `data.type`.
          headers:
            Idempotency-Replayed: { $ref: '../components.yaml#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformModuleRolloutAccepted' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformReauthenticationRequired' }
        '422':
          description: "tenant_public_ids vacía, con duplicados o con un public_id inexistente; motivo vacío (RN-BO-81, RN-BO-24)."
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  # REQ-BO-005 puntos 1-2 (1.6e). api.md §2.11-§2.14. El motor de
  # feature flags: catálogo, vista previa de impacto, el interruptor de
  # emergencia y el reemplazo de reglas por diferencia. Direccionado por
  # `key`, no por `public_id` (ADR-051).
  /api/platform/v1/feature-flags:
    get:
      operationId: listPlatformFeatureFlags
      summary: Catálogo de feature flags
      description: >
        api.md §2.11. Capacidad flag.leer. Página (ADR-038 §4.2): las
        filas nacen de una declaración en código, no de la actividad.
        Filtros module_code, status, retired (booleano), q.
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      parameters:
        - { $ref: '../components.yaml#/components/parameters/PageParam' }
        - { $ref: '../components.yaml#/components/parameters/PerPageParam' }
        - { $ref: '../components.yaml#/components/parameters/QParam' }
        - name: module_code
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [activo, forced_off] }
        - name: retired
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Página del catálogo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/PlatformFeatureFlag' }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      last_page: { type: integer }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }

  /api/platform/v1/feature-flags/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: "Clave del flag (ADR-051), formato `[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)*`."
        schema: { type: string, example: comedor.reserva_v2 }
    get:
      operationId: showPlatformFeatureFlag
      summary: Un flag y todas sus reglas vigentes
      description: >
        api.md §2.11. Capacidad flag.leer. Un `retired_at` sí devuelve
        datos (RN-BO-44, CA-BO-091) — sus reglas siguen consultables.
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '200':
          description: El flag con sus reglas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '../components.yaml#/components/schemas/PlatformFeatureFlag' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }

  /api/platform/v1/feature-flags/{key}/rules/preview:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: previewPlatformFeatureFlagRules
      summary: Vista previa de impacto de un conjunto de reglas propuesto
      description: >
        api.md §2.11, §2.13, RN-BO-68. No escribe ni bloquea nada.
        Capacidad flag.leer.
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components.yaml#/components/schemas/PlatformFeatureFlagRulesPreviewRequest' }
      responses:
        '200':
          description: Impacto estimado del conjunto propuesto.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformFeatureFlagImpact' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422':
          description: Clave de flag retirada, o una regla incoherente/duplicada.
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  /api/platform/v1/feature-flags/{key}/state:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updatePlatformFeatureFlagState
      summary: El interruptor de emergencia
      description: >
        api.md §2.11.1, §2.12 punto 2. Capacidad flag.gestionar. Apagar
        (`forced_off`) no es sensible; encender (`activo`) sí
        (RNF-MANT-005) — reautenticación exigida sólo en ese sentido.
        Incrementa `rules_version` en la misma escritura (RN-BO-42); las
        reglas no se tocan.
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components.yaml#/components/schemas/PlatformFeatureFlagStateRequest' }
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformFeatureFlagStateResult' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformReauthenticationRequired' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422':
          description: Motivo ausente/vacío, o el flag está retirado (`bo.flag.retired`).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  /api/platform/v1/feature-flags/{key}/rules:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: replacePlatformFeatureFlagRules
      summary: Reemplaza el conjunto completo de reglas de un flag
      description: >
        api.md §2.11.1, §2.12 punto 1, RN-BO-104. Capacidad
        flag.gestionar. Siempre sensible. El conjunto COMPLETO, resuelto
        por diferencia en una transacción, con un solo incremento de
        `rules_version`. `rollout_unit` no es un campo de este cuerpo
        (RN-BO-36) — enviarlo es 422.
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components.yaml#/components/schemas/PlatformFeatureFlagRulesRequest' }
      responses:
        '200':
          description: Conjunto vigente tras la escritura, con el impacto.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformFeatureFlagRulesResult' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformReauthenticationRequired' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422':
          description: Motivo ausente/vacío, regla incoherente/duplicada, flag retirado, o `rollout_unit` en el cuerpo.
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  /api/platform/v1/tenants/{publicId}/feature-flags:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    get:
      operationId: listPlatformTenantFeatureFlags
      summary: Qué flags están expuestos en un centro, y por qué regla
      description: >
        api.md §2.13. Capacidad flag.leer. `matched_by` es lo que hace
        útil este endpoint para depurar (funcional.md §5.11.8.2) — sin
        sujeto usuario, la pregunta es «qué ve este centro», no «qué ve
        esta persona» (RN-BO-41).
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '200':
          description: Decisión por cada flag del catálogo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/PlatformTenantFeatureFlagDecision' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }

  /api/platform/v1/tenants/{publicId}/early-adopter:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    put:
      operationId: updatePlatformTenantEarlyAdopter
      summary: Designa o retira la condición de early adopter de un centro
      description: >
        api.md §2.11, §2.11.1. Capacidad tenant.actualizar (es un
        atributo del centro, no una regla de despliegue) — no
        flag.gestionar. No sensible (RN-BO-109): reversible con otra
        llamada y no expone nada por sí misma. No incrementa
        `rules_version`: no cambia ninguna regla, cambia el sujeto.
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components.yaml#/components/schemas/PlatformTenantEarlyAdopterRequest' }
      responses:
        '200':
          description: Designación actualizada.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformTenantEarlyAdopterResult' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409':
          description: "El centro está `eliminado`: no admite designación (RN-BO-108, `bo.flag.tenant_state_invalid`)."
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '422':
          description: Motivo ausente o vacío.
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  # REQ-BO-004/REQ-BO-006 reducidos (1.6d). api.md §2.10 a §2.10.5. Ficha
  # de salud, trabajos fallidos del centro, su único reintento (uno a
  # uno, RN-BO-88) y las dos métricas agregadas de plataforma.
  /api/platform/v1/tenants/{publicId}/health:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    get:
      operationId: showPlatformTenantHealth
      summary: Ficha de salud de un tenant
      description: >
        api.md §2.10.1. Capacidad salud.leer. Sólo lo observable de
        verdad (RN-BO-83): un campo cuya fuente no existe se omite, nunca
        `0`/`null`. `dependency_inconsistencies` reutiliza el cálculo de
        `GET /tenants/{publicId}/modules` (RN-BO-22, no se recalcula).
      tags: [Plataforma / Salud]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '200':
          description: Los cuatro bloques de la ficha, cada uno con su alcance declarado.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformTenantHealth' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }

  /api/platform/v1/tenants/{publicId}/failed-jobs:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    get:
      operationId: listPlatformTenantFailedJobs
      summary: Trabajos fallidos de un tenant
      description: >
        api.md §2.10.2. Capacidad salud.leer. Cursor `(failed_at DESC, id
        DESC)`, filtrado por `payload.tenant_id` (ADR-033 §8) — no
        alcanza a los cuatro trabajos que el backoffice despacha sin
        tenant activo (RN-BO-90). Sin `q` de texto libre a propósito
        (RN-BO-84): sólo podría buscar dentro de `payload`/`exception`.
      tags: [Plataforma / Salud]
      security: [{ PlatformSessionCookie: [] }]
      parameters:
        - name: failed_at_from
          in: query
          schema: { type: string, format: date-time }
        - name: failed_at_to
          in: query
          schema: { type: string, format: date-time }
        - name: queue
          in: query
          schema: { type: string }
        - name: job_class
          in: query
          schema: { type: string }
        - { $ref: '../components.yaml#/components/parameters/CursorParam' }
        - { $ref: '../components.yaml#/components/parameters/LimitParam' }
      responses:
        '200':
          description: Página de trabajos fallidos del centro, orden failed_at DESC.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/PlatformFailedJob' }
                  meta: { $ref: '../components.yaml#/components/schemas/CursorMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }

  /api/platform/v1/tenants/{publicId}/failed-jobs/{uuid}/retry:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
      - name: uuid
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: retryPlatformTenantFailedJob
      summary: Reintenta un trabajo fallido de un tenant
      description: >
        api.md §2.10.3. Capacidad job.reintentar, sensible (OPEN-BO-21).
        Reencola el `payload` literal, con los intentos reiniciados,
        nunca recompuesto (RN-BO-85). No existe reintento masivo
        (RN-BO-88). `uuid` inexistente, de otro centro o ya reintentado
        responden todos igual: 404, nunca 403 (RN-BO-90).
      tags: [Plataforma / Salud]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../components.yaml#/components/schemas/PlatformFailedJobRetryRequest' }
      responses:
        '200':
          description: Bloque `jobs` de la ficha de salud, actualizado tras el reintento.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      jobs: { type: object }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformReauthenticationRequired' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409':
          description: "Tenant eliminado, no admite reintento (bo.job.tenant_state_invalid, RN-BO-87)."
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '422':
          description: "Motivo ausente o vacío (bo.job.reason_required)."
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  /api/platform/v1/metrics/platform:
    get:
      operationId: showPlatformMetricsPlatform
      summary: Tenants por estado, altas, bajas y eliminaciones
      description: >
        api.md §2.10.4. Capacidad metrica.leer. Corre dentro de
        `runAsPlatform(BackofficeLectura, …)` (RN-BO-94): fuera de ese
        bloque el agregado no falla, sale reducido al tenant activo. Sin
        caché ni materialización (RN-BO-95).
      tags: [Plataforma / Métricas]
      security: [{ PlatformSessionCookie: [] }]
      parameters:
        - name: occurred_at_from
          in: query
          description: Inclusivo. Por omisión, 30 días atrás.
          schema: { type: string, format: date-time }
        - name: occurred_at_to
          in: query
          description: Inclusivo. Por omisión, ahora.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Cinco recuentos por estado más tres series del período.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformMetricsPlatform' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '422':
          description: "occurred_at_from posterior a occurred_at_to (bo.metrics.invalid_period)."
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  /api/platform/v1/metrics/module-adoption:
    get:
      operationId: showPlatformModuleAdoption
      summary: Adopción de módulos, sobre el catálogo declarado
      description: >
        api.md §2.10.5. Capacidad metrica.leer. La lista la marca
        `ModuleCatalog::all()`, no las filas existentes (RN-BO-93): un
        módulo sin ninguna contratación aparece con `0`; un esencial,
        marcado y sin recuento; un retirado, con su marca y su recuento
        real. Corre dentro de `runAsPlatform(BackofficeLectura, …)`
        (RN-BO-94). Sin parámetros, sin paginar.
      tags: [Plataforma / Métricas]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '200':
          description: Una fila por módulo declarado, con el denominador.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformModuleAdoption' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }

  # REQ-BO-007 (1.6b). api.md §2.8. Doble autorización. La aprobación y
  # el rechazo se rigen por la capacidad de la ACCIÓN AUTORIZADA
  # (permisos.md §5.2), no por una capacidad propia — no existe
  # `autorizacion.aprobar`.
  /api/platform/v1/dual-authorizations:
    get:
      operationId: listPlatformDualAuthorizations
      summary: Solicitudes de doble autorización
      description: "api.md §2.8. Capacidad autorizacion.leer. Filtros status, action, requested_by."
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pendiente, aprobada, rechazada, caducada, ejecutada, fallida] }
        - name: action
          in: query
          schema: { type: string }
        - name: requested_by
          in: query
          schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
        - { $ref: '../components.yaml#/components/parameters/PageParam' }
        - { $ref: '../components.yaml#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Página de solicitudes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/DualAuthorization' }
                  meta: { $ref: '../components.yaml#/components/schemas/PageMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }

  /api/platform/v1/dual-authorizations/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    get:
      operationId: getPlatformDualAuthorization
      summary: Detalle de una solicitud, con el payload congelado
      description: "api.md §2.8. Capacidad autorizacion.leer."
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '200':
          description: La solicitud.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '../components.yaml#/components/schemas/DualAuthorization' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }

  /api/platform/v1/dual-authorizations/{publicId}/approval:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    post:
      operationId: approvePlatformDualAuthorization
      summary: Aprueba y ejecuta la operación congelada
      description: >
        REQ-BO-007, funcional.md §5.7, api.md §2.8. Sensible. Capacidad de
        la acción autorizada (permisos.md §5.2) — quien aprueba
        `tenant.eliminar` necesita `tenant.eliminar`. `RN-BO-19`: el
        aprobador no puede ser el solicitante, garantizado por el motor
        (`CHECK dual_authorizations_distinct_approver`). Si la operación
        congelada ha dejado de ser válida (RN-BO-20), la solicitud queda
        `fallida` y responde `409`.
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resolution_reason: { type: string, nullable: true }
      responses:
        '200':
          description: Aprobada y ejecutada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '../components.yaml#/components/schemas/DualAuthorization' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformReauthenticationRequired' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409':
          description: "Caducada (bo.dual_auth.expired), ya resuelta (bo.dual_auth.already_resolved), aprobador=solicitante (bo.dual_auth.same_actor), o parámetros ya no válidos (bo.dual_auth.payload_mismatch, RN-BO-20)."
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  /api/platform/v1/dual-authorizations/{publicId}/rejection:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    post:
      operationId: rejectPlatformDualAuthorization
      summary: Rechaza una solicitud, con motivo
      description: "REQ-BO-007, funcional.md §5.7 punto 5, api.md §2.8. Sensible. Capacidad de la acción autorizada."
      tags: [Plataforma]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution_reason]
              properties:
                resolution_reason: { type: string }
      responses:
        '200':
          description: Rechazada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '../components.yaml#/components/schemas/DualAuthorization' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformReauthenticationRequired' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409':
          description: "Caducada o ya resuelta."
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
