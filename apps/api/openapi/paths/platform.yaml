# REQ-BO-007 (paso 1.6). Convenciones transversales en
# docs/adr/ADR-038-convenciones-api-rest.md — este fichero no las repite,
# solo las aplica. Contrato completo en docs/modulos/REQ-BO/api.md.
#
# Issue #175: dieciocho rutas del chasis sin documentar (veintidós
# operaciones — algunas rutas llevan más de un verbo), más
# /admin-invitation-redemptions (issue #173). El issue original estimó
# "doce"; el recuento real sobre routes.php es mayor porque cuenta cada
# verbo HTTP de una misma ruta como operación propia (p. ej. GET/PATCH/
# DELETE /admins/{publicId} son tres), no solo la plantilla de ruta.
#
# Grupo hermano de /api/v1 (api.md §0): servido únicamente bajo el host
# de plataforma (BACKOFFICE_HOST), con guard, cookie de sesión
# (PlatformSessionCookie, ../components.yaml) y tabla de sesión propios.
# Toda ruta de este fichero, sin excepción, puede responder:
#   - 404 PlatformHostMismatch (RN-BO-48) si el Host no es BACKOFFICE_HOST
#   - 403 PlatformIpNotAllowed (RN-BO-06/07) si la IP no está en la lista blanca
# Se documentan una sola vez aquí, no en cada operación (api.md §1.1,
# puestos 1-2 de la pila, antes que sesión y credenciales).
#
# Autenticación: `security: []` en las rutas anónimas (crean/resuelven la
# sesión, o el canje de invitación); `security: [{ PlatformSessionCookie:
# [] }]` en el resto — incluidas las tres de alta de MFA, que solo
# necesitan sesión, sin factor confirmado todavía (RN-BO-05, api.md
# §1.1.1). La capacidad exigida por `require-platform-capability`
# (permisos.md §2-§4) se indica en la descripción de cada operación
# sensible; OpenAPI 3.1 no modela ese sistema de capacidades propio como
# un esquema de seguridad adicional.

paths:
  /api/platform/v1/csrf-cookie:
    get:
      operationId: getPlatformCsrfCookie
      summary: Semilla de la cookie CSRF de plataforma
      description: >
        api.md §2.1. Con límite de tasa desde el primer día (issue #74,
        hallazgo Alta en 1.2, no repetido aquí).
      tags: [Plataforma / Sesión]
      security: []
      responses:
        '204':
          description: Sin cuerpo. Cookies dejadas en la respuesta.
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }

  /api/platform/v1/auth/session:
    post:
      operationId: createPlatformSession
      summary: Login de plataforma — credenciales, nunca sesión plena antes del segundo factor
      description: >
        api.md §2.1, funcional.md §5.1. `200` con `mfa_required: true` si
        falta el segundo paso (`POST /auth/session/mfa`); con
        `mfa_enrollment_required: true` si el administrador no tiene
        factor confirmado — entra sin sesión plena y solo alcanza `/mfa/*`
        (RN-BO-05). `401` con mensaje idéntico para correo inexistente y
        contraseña incorrecta.
      tags: [Plataforma / Sesión]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Credenciales válidas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfa_required: { type: boolean }
                  mfa_enrollment_required: { type: boolean }
        '401':
          description: Credenciales inválidas — mensaje idéntico para usuario inexistente y contraseña incorrecta.
          headers:
            X-Request-Id: { $ref: '../components.yaml#/components/headers/XRequestId' }
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }

  /api/platform/v1/auth/session/mfa:
    post:
      operationId: createPlatformSessionMfa
      summary: Resuelve el desafío TOTP y emite la sesión plena
      description: api.md §2.1. Único paso que emite la sesión con factor ya confirmado.
      tags: [Plataforma / Sesión]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Sesión plena emitida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfa_required: { type: boolean, enum: [false] }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }

  /api/platform/v1/admin-invitation-redemptions:
    post:
      operationId: createPlatformAdminInvitationRedemption
      summary: Canje de la invitación de un administrador de plataforma — fija la contraseña
      description: >
        Issue #173, operacion.md §5 paso 6. Precedente de forma:
        `POST /api/v1/auth/invitation-redemptions` (REQ-AUTH). Anónimo,
        autorizado por posesión del token — el sujeto todavía no tiene
        sesión con la que tener capacidades. **No** abre sesión (mismo
        criterio que RN-AUTH-21): el administrador entra después con
        `POST /auth/session`, donde, sin MFA confirmado, sólo alcanza
        `/mfa/*` (RN-BO-05). No existe todavía un `CA-BO` numerado para
        este endpoint — hueco de especificación reportado en la
        resolución del issue #173, no un contrato inventado aquí.
      tags: [Plataforma / Sesión]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, password_confirmation]
              properties:
                token: { type: string, description: "Token en claro, nunca en la ruta." }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '204':
          description: Contraseña fijada. La invitación queda canjeada; un segundo canje del mismo token responde 410.
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }
        '410': { $ref: '../components.yaml#/components/responses/Gone' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }

  /api/platform/v1/auth/reauthenticate:
    post:
      operationId: createPlatformReauthentication
      summary: Reautenticación para operaciones sensibles (RN-BO-08)
      description: >
        api.md §2.1, §4. Contraseña **y** segundo factor. Marca la sesión
        como reautenticada durante `BO_REAUTH_WINDOW` minutos — estado de
        sesión, no de tabla. A diferencia de las cinco rutas de arriba,
        **exige** sesión con MFA ya superado: no es una excepción de MFA
        (issue #174).
      tags: [Plataforma / Sesión]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string }
      responses:
        '204':
          description: Reautenticado. Auditado como reautenticacion.superada.
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
        '429': { $ref: '../components.yaml#/components/responses/TooManyRequests' }

  /api/platform/v1/me:
    get:
      operationId: getPlatformMe
      summary: El administrador autenticado y sus roles
      description: api.md §2.1. Sin permiso, por identidad del portador — igual que GET /me en REQ-CORE.
      tags: [Plataforma / Sesión]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '200':
          description: El administrador de la sesión actual.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformAdmin' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }

  /api/platform/v1/mfa/factors:
    post:
      operationId: createPlatformMfaFactor
      summary: Alta del segundo factor TOTP (obligatorio, RN-BO-05)
      description: >
        api.md §2.1. Única vía: sólo TOTP (datos.md §2.4, sin correo como
        segundo factor en el backoffice, a diferencia del tenant).
        Alcanzable con sesión sin MFA confirmado — es, junto con `confirm`
        y `recovery-codes`, la excepción que RN-BO-05 exige.
      tags: [Plataforma / Sesión]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '201':
          description: Factor creado sin confirmar, con su URI otpauth para el generador TOTP.
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_id: { $ref: '../components.yaml#/components/schemas/PublicId' }
                  otpauth_uri: { type: string, format: uri }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }

  /api/platform/v1/mfa/factors/{publicId}/confirm:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    post:
      operationId: confirmPlatformMfaFactor
      summary: Confirma el segundo factor y entrega los códigos de recuperación
      description: >
        api.md §2.1. Los códigos de recuperación en claro se muestran
        **una sola vez**, aquí — GET /mfa/recovery-codes sólo informa el
        recuento sin usar.
      tags: [Plataforma / Sesión]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Factor confirmado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }
                    description: En claro, sólo en esta respuesta. Sólo el hash se persiste.
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }
        '422':
          description: Código incorrecto (bo.mfa.invalid_code), o el factor ya estaba confirmado.
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  /api/platform/v1/mfa/recovery-codes:
    get:
      operationId: listPlatformMfaRecoveryCodes
      summary: Recuento de códigos de recuperación sin usar
      description: >
        api.md §2.1. Nunca el valor de los códigos — sólo se muestran una
        vez, al confirmar el factor.
      tags: [Plataforma / Sesión]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '200':
          description: Recuento.
          content:
            application/json:
              schema:
                type: object
                properties:
                  remaining: { type: integer, minimum: 0 }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }

  /api/platform/v1/admins:
    get:
      operationId: listPlatformAdmins
      summary: Administradores de plataforma
      description: "api.md §2.2. Capacidad `admin.leer` (sólo `superadministrador`, permisos.md §4.1). Filtros status, role, q."
      tags: [Plataforma / Administradores]
      security: [{ PlatformSessionCookie: [] }]
      parameters:
        - name: status
          in: query
          description: Repetible, separado por comas.
          schema: { type: string, enum: [activo, suspendido] }
        - name: q
          in: query
          description: Busca en name/email.
          schema: { type: string }
        - { $ref: '../components.yaml#/components/parameters/PageParam' }
        - { $ref: '../components.yaml#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Página de administradores.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/PlatformAdmin' }
                  meta: { $ref: '../components.yaml#/components/schemas/PageMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/PlatformIpNotAllowed' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }
    post:
      operationId: createPlatformAdmin
      summary: Crea un administrador de plataforma — sin contraseña utilizable, e invita
      description: >
        api.md §2.2, §4. Capacidad `admin.crear` (superadministrador) +
        reautenticación (operación sensible). Crea con contraseña
        aleatoria descartada y despacha, en cola, una invitación real por
        correo — token de un solo uso, canjeable en
        `POST /admin-invitation-redemptions` (issue #173, antes de la
        corrección esta invitación nunca se emitía).
      tags: [Plataforma / Administradores]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, locale, role]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                locale: { $ref: '../components.yaml#/components/schemas/Locale' }
                role: { type: string, enum: [soporte, operaciones, comercial, superadministrador] }
      responses:
        '201':
          description: Administrador creado.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformAdmin' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403':
          description: Sin la capacidad admin.crear, IP no permitida, o sin reautenticación viva (PlatformReauthenticationRequired).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '404': { $ref: '../components.yaml#/components/responses/PlatformHostMismatch' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/platform/v1/admins/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    get:
      operationId: getPlatformAdmin
      summary: Un administrador de plataforma
      description: "api.md §2.2. Capacidad admin.leer."
      tags: [Plataforma / Administradores]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '200':
          description: Administrador.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformAdmin' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
    patch:
      operationId: updatePlatformAdmin
      summary: Actualiza nombre e idioma de un administrador
      description: "api.md §2.2. Capacidad admin.actualizar. El correo no se cambia por esta vía."
      tags: [Plataforma / Administradores]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, locale]
              properties:
                name: { type: string }
                locale: { $ref: '../components.yaml#/components/schemas/Locale' }
      responses:
        '200':
          description: Administrador actualizado.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformAdmin' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }
    delete:
      operationId: deletePlatformAdmin
      summary: Elimina (borrado lógico) un administrador de plataforma
      description: >
        api.md §2.2, §4. Capacidad admin.eliminar + reautenticación.
        `409` si el actor es el propio sujeto (RN-BO-10) o si deja la
        plataforma sin ningún superadministrador vivo y activo (RN-BO-11).
      tags: [Plataforma / Administradores]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '204':
          description: Eliminado (borrado lógico). Sesiones vivas revocadas.
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403':
          description: Sin la capacidad admin.eliminar, IP no permitida, o sin reautenticación viva.
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409':
          description: El actor es el propio sujeto (RN-BO-10), o dejaría la plataforma sin superadministrador (RN-BO-11).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/platform/v1/admins/{publicId}/roles:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    put:
      operationId: replacePlatformAdminRoles
      summary: Sustituye el conjunto completo de roles de un administrador
      description: >
        api.md §2.2. Capacidad admin.rol.gestionar. Conjunto completo, no
        incremental. Mismos `409` que DELETE /admins/{publicId}
        (RN-BO-10, RN-BO-11).
      tags: [Plataforma / Administradores]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles, reason]
              properties:
                roles:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [soporte, operaciones, comercial, superadministrador] }
                reason: { type: string }
      responses:
        '200':
          description: Roles sustituidos.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformAdmin' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409':
          description: El actor es el propio sujeto (RN-BO-10), o el conjunto nuevo deja la plataforma sin superadministrador (RN-BO-11).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/platform/v1/admins/{publicId}/status:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    post:
      operationId: updatePlatformAdminStatus
      summary: Suspende o reactiva un administrador de plataforma
      description: >
        api.md §2.2, datos.md §2.7. Capacidad admin.actualizar. Suspender
        revoca las sesiones vivas del administrador (no sólo impide que
        vuelva a entrar). Mismos `409` que DELETE /admins/{publicId}.
      tags: [Plataforma / Administradores]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [activo, suspendido] }
                reason: { type: string }
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformAdmin' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409':
          description: El actor es el propio sujeto, o suspenderlo deja la plataforma sin superadministrador (RN-BO-10, RN-BO-11).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/platform/v1/admins/{publicId}/mfa:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    delete:
      operationId: resetPlatformAdminMfa
      summary: Restablece el segundo factor de otro administrador
      description: >
        api.md §2.2, §4, CA-BO-012. Capacidad admin.mfa.restablecer +
        reautenticación. Sensible: **nunca** autoservicio (`409` si el
        actor es el propio sujeto), **nunca** por correo — sólo otro
        superadministrador, por esta vía, con auditoría.
      tags: [Plataforma / Administradores]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '204':
          description: Factor y códigos de recuperación borrados. Sesiones vivas revocadas.
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403':
          description: Sin la capacidad admin.mfa.restablecer, IP no permitida, o sin reautenticación viva.
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '409':
          description: El actor intenta restablecerse el MFA a sí mismo (RN-BO-10).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  /api/platform/v1/ip-allowlist:
    get:
      operationId: listPlatformIpAllowlist
      summary: Lista blanca de IP de plataforma
      description: "api.md §2.3. Capacidad ip_allowlist.leer."
      tags: [Plataforma / Lista blanca IP]
      security: [{ PlatformSessionCookie: [] }]
      parameters:
        - { $ref: '../components.yaml#/components/parameters/PageParam' }
        - { $ref: '../components.yaml#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Página de entradas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/PlatformIpAllowlistEntry' }
                  meta: { $ref: '../components.yaml#/components/schemas/PageMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
    post:
      operationId: createPlatformIpAllowlistEntry
      summary: Añade una entrada a la lista blanca de IP
      description: >
        api.md §2.3. Capacidad ip_allowlist.gestionar + reautenticación
        (sensible). RN-BO-06/07: nunca vacía como "sin restricción" —
        cada entrada es explícita, auditada y con autor.
      tags: [Plataforma / Lista blanca IP]
      security: [{ PlatformSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cidr, description]
              properties:
                cidr: { type: string, example: "203.0.113.0/24" }
                description: { type: string }
      responses:
        '201':
          description: Entrada creada.
          content:
            application/json:
              schema: { $ref: '../components.yaml#/components/schemas/PlatformIpAllowlistEntry' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403':
          description: Sin la capacidad ip_allowlist.gestionar, IP no permitida, o sin reautenticación viva.
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '422': { $ref: '../components.yaml#/components/responses/ValidationError' }

  /api/platform/v1/ip-allowlist/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    delete:
      operationId: deletePlatformIpAllowlistEntry
      summary: Retira una entrada de la lista blanca de IP
      description: >
        api.md §2.3. Capacidad ip_allowlist.gestionar + reautenticación.
        **No** comprueba si el solicitante se está dejando fuera a sí
        mismo (deliberado: una red corporativa tiene varias salidas; un
        bloqueo total se resuelve por consola en el servidor, RN-BO-07).
      tags: [Plataforma / Lista blanca IP]
      security: [{ PlatformSessionCookie: [] }]
      responses:
        '204':
          description: Entrada retirada.
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403':
          description: Sin la capacidad ip_allowlist.gestionar, IP no permitida, o sin reautenticación viva.
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }

  /api/platform/v1/admin-action-logs:
    get:
      operationId: listAdminActionLogs
      summary: Auditoría de plataforma (todas las entradas)
      description: >
        api.md §2.9, §3.2, datos.md §4. Capacidad auditoria_plataforma.leer
        (sin exportar, a propósito — permisos.md §5.4). Corre como
        `plataforma_platform` (BYPASSRLS): ve la tabla entera, a
        diferencia de `GET /api/v1/platform-actions` (REQ-CORE), que un
        centro usa para ver sólo lo que le afecta. Cursor cifrado con el
        `platform_admin_id` del emisor — uno emitido por otra sesión
        responde 422 (bo.validation.cursor_invalid).
      tags: [Plataforma / Auditoría]
      security: [{ PlatformSessionCookie: [] }]
      parameters:
        - name: action
          in: query
          description: Repetible, separado por comas.
          schema: { type: string }
        - name: actor_platform_admin_id
          in: query
          schema: { type: integer }
        - name: affected_tenant_id
          in: query
          schema: { type: integer }
        - name: occurred_at_from
          in: query
          schema: { type: string, format: date-time }
        - name: occurred_at_to
          in: query
          schema: { type: string, format: date-time }
        - { $ref: '../components.yaml#/components/parameters/CursorParam' }
        - { $ref: '../components.yaml#/components/parameters/LimitParam' }
      responses:
        '200':
          description: Página de acciones de plataforma, orden occurred_at DESC.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/AdminActionLog' }
                  meta: { $ref: '../components.yaml#/components/schemas/CursorMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '422':
          description: Cursor inválido, o emitido por otra sesión (api.md §3.2).
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }

  /api/platform/v1/tenants/{publicId}/admin-action-logs:
    parameters:
      - name: publicId
        in: path
        required: true
        description: public_id del tenant.
        schema: { $ref: '../components.yaml#/components/schemas/PublicId' }
    get:
      operationId: listTenantAdminActionLogs
      summary: Auditoría de plataforma que afecta a un centro concreto
      description: >
        api.md §2.9. Capacidad tenant.leer. Mismo mecanismo de cursor que
        `GET /admin-action-logs`, acotado a `affected_tenant_id` del
        tenant indicado.
      tags: [Plataforma / Auditoría]
      security: [{ PlatformSessionCookie: [] }]
      parameters:
        - { $ref: '../components.yaml#/components/parameters/CursorParam' }
        - { $ref: '../components.yaml#/components/parameters/LimitParam' }
      responses:
        '200':
          description: Página de acciones de plataforma sobre ese tenant, orden occurred_at DESC.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '../components.yaml#/components/schemas/AdminActionLog' }
                  meta: { $ref: '../components.yaml#/components/schemas/CursorMeta' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
        '422':
          description: Cursor inválido, o emitido por otra sesión.
          content:
            application/problem+json:
              schema: { $ref: '../components.yaml#/components/schemas/Problem' }
