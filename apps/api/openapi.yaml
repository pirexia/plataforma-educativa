openapi: 3.1.0
info:
  title: Plataforma de Gestión Educativa — API
  version: 0.1.0
  description: >
    Fuente de verdad funcional: docs/REQUISITOS-PLATAFORMA-EDUCATIVA.md.
    API-first (INV-006): todo endpoint existe aquí antes que en la SPA.
    Convenciones transversales: docs/adr/ADR-038-convenciones-api-rest.md.
servers:
  - url: http://localhost:8000
    description: Desarrollo local

tags:
  - name: Plataforma
  - name: Core / Tenant
  - name: Core / Usuarios
  - name: Core / Invitaciones
  - name: Core / Roles
  - name: Core / Módulos
  - name: Core / Importación
  - name: Core / Auditoría
  - name: Core / Autoservicio
  - name: Auth / Sesión
  - name: Auth / Canje
  - name: Auth / Recuperación
  - name: Auth / Bloqueo
  - name: Auth / MFA

# ADR-038 §12.2: componentes compartidos (Problem, PageMeta, CursorMeta,
# parámetros comunes) en un fichero propio, referenciados por $ref desde
# cada módulo — nunca redefinidos.
components:
  $ref: "openapi/components.yaml#/components"

# Cada ruta es un $ref de Path Item Object hacia el fichero del módulo
# correspondiente (ADR-038 §12.2: "$ref entre ficheros hermanos, sin paso
# de empaquetado"). Añadir un módulo nuevo es añadir sus entradas aquí,
# nunca escribir la ruta dos veces.
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Estado de la API
      description: Comprobación de vida sin autenticación. No expone datos de negocio.
      tags: [Plataforma]
      security: []
      responses:
        '200':
          description: La API responde
          content:
            application/json:
              schema:
                type: object
                required: [status, version, timestamp]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  version:
                    type: string
                    example: 0.1.0
                  timestamp:
                    type: string
                    format: date-time

  # REQ-CORE (paso 1.1) — apps/api/openapi/paths/core.yaml
  /api/v1/tenant:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1tenant"
  /api/v1/tenant/branding:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1tenant~1branding"
  /api/v1/tenant/settings:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1tenant~1settings"
  /api/v1/tenant/settings/assets/{kind}:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1tenant~1settings~1assets~1{kind}"
  /api/v1/me:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1me"
  /api/v1/users:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1users"
  /api/v1/users/{publicId}:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1users~1{publicId}"
  /api/v1/users/{publicId}/restore:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1users~1{publicId}~1restore"
  /api/v1/users/{publicId}/status:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1users~1{publicId}~1status"
  /api/v1/invitations:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1invitations"
  /api/v1/users/{publicId}/invitations:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1users~1{publicId}~1invitations"
  /api/v1/invitations/{publicId}:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1invitations~1{publicId}"
  /api/v1/roles:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1roles"
  /api/v1/roles/{publicId}:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1roles~1{publicId}"
  /api/v1/permissions:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1permissions"
  /api/v1/users/{publicId}/roles:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1users~1{publicId}~1roles"
  /api/v1/modules:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1modules"
  /api/v1/module-subscriptions/{publicId}:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1module-subscriptions~1{publicId}"
  /api/v1/user-imports:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1user-imports"
  /api/v1/user-imports/{publicId}:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1user-imports~1{publicId}"
  /api/v1/user-imports/{publicId}/execute:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1user-imports~1{publicId}~1execute"
  /api/v1/audit-logs:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1audit-logs"
  /api/v1/audit-logs/exports:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1audit-logs~1exports"
  /api/v1/data-exports/{publicId}:
    $ref: "openapi/paths/core.yaml#/paths/~1api~1v1~1data-exports~1{publicId}"

  # REQ-AUTH (paso 1.2). apps/api/openapi/paths/auth.yaml.
  /api/v1/auth/csrf-cookie:
    $ref: "openapi/paths/auth.yaml#/paths/~1api~1v1~1auth~1csrf-cookie"
  /api/v1/auth/session:
    $ref: "openapi/paths/auth.yaml#/paths/~1api~1v1~1auth~1session"
  /api/v1/auth/invitation-redemptions:
    $ref: "openapi/paths/auth.yaml#/paths/~1api~1v1~1auth~1invitation-redemptions"
  /api/v1/auth/password-reset-requests:
    $ref: "openapi/paths/auth.yaml#/paths/~1api~1v1~1auth~1password-reset-requests"
  /api/v1/auth/password-resets:
    $ref: "openapi/paths/auth.yaml#/paths/~1api~1v1~1auth~1password-resets"
  /api/v1/auth/account-unlocks:
    $ref: "openapi/paths/auth.yaml#/paths/~1api~1v1~1auth~1account-unlocks"
  /api/v1/auth/password-changes:
    $ref: "openapi/paths/auth.yaml#/paths/~1api~1v1~1auth~1password-changes"
  /api/v1/account-lockouts:
    $ref: "openapi/paths/auth.yaml#/paths/~1api~1v1~1account-lockouts"
  /api/v1/account-lockouts/{publicId}:
    $ref: "openapi/paths/auth.yaml#/paths/~1api~1v1~1account-lockouts~1{publicId}"

  # REQ-AUTH-003 (paso 1.3). apps/api/openapi/paths/mfa.yaml. El
  # undécimo endpoint de este paso, PATCH /api/v1/roles/{publicId}
  # acotado a mfa_required, está arriba junto al resto de REQ-CORE
  # (core.yaml): REQ-CORE es dueño del recurso roles (§C.2.2).
  /api/v1/auth/mfa-enrollments:
    $ref: "openapi/paths/mfa.yaml#/paths/~1api~1v1~1auth~1mfa-enrollments"
  /api/v1/auth/mfa-factors:
    $ref: "openapi/paths/mfa.yaml#/paths/~1api~1v1~1auth~1mfa-factors"
  /api/v1/auth/mfa-factors/{publicId}:
    $ref: "openapi/paths/mfa.yaml#/paths/~1api~1v1~1auth~1mfa-factors~1{publicId}"
  /api/v1/auth/mfa:
    $ref: "openapi/paths/mfa.yaml#/paths/~1api~1v1~1auth~1mfa"
  /api/v1/auth/mfa-recovery-codes:
    $ref: "openapi/paths/mfa.yaml#/paths/~1api~1v1~1auth~1mfa-recovery-codes"
  /api/v1/auth/mfa-challenges:
    $ref: "openapi/paths/mfa.yaml#/paths/~1api~1v1~1auth~1mfa-challenges"
  /api/v1/auth/mfa-verifications:
    $ref: "openapi/paths/mfa.yaml#/paths/~1api~1v1~1auth~1mfa-verifications"
  /api/v1/mfa-compliance:
    $ref: "openapi/paths/mfa.yaml#/paths/~1api~1v1~1mfa-compliance"
  /api/v1/mfa-resets:
    $ref: "openapi/paths/mfa.yaml#/paths/~1api~1v1~1mfa-resets"

  # Los endpoints de los módulos siguientes se añaden aquí conforme se
  # implementan, cada uno con su propio apps/api/openapi/paths/<modulo>.yaml.
