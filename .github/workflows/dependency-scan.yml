name: Escaneo de dependencias

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy (composer.lock, package-lock.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
