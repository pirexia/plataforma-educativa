name: CI · E2E real (API)

# E2E real contra la API real en una pila efímera del runner (issue #737, ADR-091,
# docs/proceso/e2e-real-ci.md §3 y §12). E2E-CI-c: todas las suites (las siete de `e2e-real-api.sh`, `:prl` y `:alum`) en un solo job y en serie.
#
# Tres jobs, mismo patrón que ADR-089:
#   cambios   -> decide con `git diff` si el cambio toca algo que el E2E real ejercita
#                (sin filtro `paths:` en `on:`: un check requerido que no se dispara bloquea el PR
#                para siempre, SYSADMIN.md §4, y sin acción de terceros, CLAUDE.md §1).
#   e2e-real  -> levanta la pila de compose.yaml y ejecuta Playwright sin reintentos.
#   agregador -> «E2E real (API)», el único nombre que se marca como required check (a mano).
#
# Nunca `pull_request_target`: los PR de forks corren sin secretos; todos los que usa el job son
# efímeros y se generan en él.

on:
  pull_request:
    branches: [develop, main, staging]
  push:
    branches: [develop]

# Issue #401: el GITHUB_TOKEN solo lee por defecto.
permissions:
  contents: read

# Dos ejecuciones del mismo PR no aportan nada y gastan runner; en push no se cancela nada.
concurrency:
  group: ci-e2e-real-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cambios:
    name: E2E real · detección de cambios
    runs-on: ubuntu-26.04  # fijada: ubuntu-latest migra a 26.04 hasta el 19-11-2026 (#609, actions/runner-images#14748)
    timeout-minutes: 5
    outputs:
      ejecutar: ${{ steps.decidir.outputs.ejecutar }}
    steps:
      # Historia completa: hace falta el punto de bifurcación con la rama destino del PR.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decidir si hay que ejecutar el E2E real
        id: decidir
        env:
          EVENTO: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # push a develop: se ejecuta siempre, sin mirar el diff (detecta roturas por combinación de dos PR).
          if [ "$EVENTO" != "pull_request" ]; then
            echo "Evento $EVENTO: ejecutar=true sin calcular el diff."
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Si el cálculo falla (base no alcanzable, historia insuficiente) el job falla: nunca «no se pudo calcular, así que no corre».
          git diff --name-only -z "origin/${BASE_REF}...HEAD" > "$RUNNER_TEMP/ficheros-cambiados.bin"
          # `%q` escapa saltos de línea y `::`: un nombre de fichero hostil no puede falsear órdenes de workflow en el registro.
          xargs -0 -r printf '  %q\n' < "$RUNNER_TEMP/ficheros-cambiados.bin"
          ejecutar="$(bash apps/web/scripts/e2e-real-cambios.sh < "$RUNNER_TEMP/ficheros-cambiados.bin")"
          case "$ejecutar" in
            true|false) ;;
            *) echo "::error::La regla de rutas devolvió «$ejecutar»"; exit 1 ;;
          esac
          echo "ejecutar=$ejecutar"
          echo "ejecutar=$ejecutar" >> "$GITHUB_OUTPUT"

  e2e-real:
    name: E2E real · todas las suites
    runs-on: ubuntu-26.04  # fijada: ubuntu-latest migra a 26.04 hasta el 19-11-2026 (#609, actions/runner-images#14748)
    needs: cambios
    if: needs.cambios.outputs.ejecutar == 'true'
    # 30 min, valor definitivo (E2E-CI-c, CA-E2ECI-11): tres ejecuciones completas midieron 7:39, 8:22 y 8:15
    # (máximo 8:22), holgura ×3,6; por debajo de ~10 min no se cumple el disparador de D3.
    timeout-minutes: 30
    env:
      # `E2E_ONLY` no se define: `e2e-real-api.sh` ejecuta sus siete suites (vacía = todas).
      # Un único *runtime* (ADR-091 §2.2): nunca el alias CONTAINER_CLI (los guiones abortan si difieren).
      CONTAINER_RUNTIME: docker
      # compose.yaml: api y worker contra Garage (ADR-076).
      FILESYSTEM_DISK: s3
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v7

      # `runner.temp` no existe en el contexto de `env:` a nivel de job (solo en pasos): estas rutas se fijan aquí.
      - name: Marcar inicio del job y fijar rutas del informe
        run: |
          {
            echo "E2E_T_INICIO=$(date +%s)"
            echo "E2E_TIEMPOS_LOG=$RUNNER_TEMP/e2e-tiempos.log"
            echo "E2E_INFORMES_DIR=$RUNNER_TEMP/e2e-informes"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Dependencias del frontend y navegador de Playwright
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, zip, intl, mbstring, redis, gd, exif, pcntl
          coverage: none

      - uses: actions/cache@v6
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Marcar fin de la instalación
        run: echo "E2E_T_INSTALADO=$(date +%s)" >> "$GITHUB_ENV"

      # Secretos efímeros: aleatorios por ejecución, enmascarados y solo en ficheros del runner, que muere con el job
      # (patrón del job `storage-conformance` de ci-api.yml). La base se llama `plataforma`: apps/web/scripts/lib/e2e-purge.sh
      # purga esa base y no otra.
      - name: Generar .env y apps/api/.env con secretos efímeros
        run: |
          set -euo pipefail
          pg="$(openssl rand -hex 24)"
          owner="$(openssl rand -hex 24)"
          app="$(openssl rand -hex 24)"
          platform="$(openssl rand -hex 24)"
          rpc="$(openssl rand -hex 32)"
          admin="$(openssl rand -hex 32)"
          key_id="GK$(openssl rand -hex 12)"
          secret="$(openssl rand -hex 32)"
          app_key_raw="$(openssl rand -base64 32)"
          for v in "$pg" "$owner" "$app" "$platform" "$rpc" "$admin" "$key_id" "$secret" "$app_key_raw" "base64:$app_key_raw"; do
            echo "::add-mask::$v"
          done
          {
            echo "POSTGRES_DB=plataforma"
            echo "POSTGRES_USER=plataforma"
            echo "POSTGRES_PASSWORD=$pg"
            echo "TENANCY_OWNER_PASSWORD=$owner"
            echo "TENANCY_APP_PASSWORD=$app"
            echo "TENANCY_PLATFORM_PASSWORD=$platform"
            echo "GARAGE_RPC_SECRET=$rpc"
            echo "GARAGE_ADMIN_TOKEN=$admin"
            echo "GARAGE_ACCESS_KEY_ID=$key_id"
            echo "GARAGE_SECRET_ACCESS_KEY=$secret"
            echo "GARAGE_BUCKET=plataforma-ci"
          } > .env
          cp apps/api/.env.example apps/api/.env
          # `docker compose` valida todo compose.yaml, también con `exec`: el servicio `web` (que no se levanta) declara
          # `env_file: apps/web/.env` y, sin el fichero, cualquier orden de compose falla (primer E2E real en Actions, 2026-11-18).
          cp apps/web/.env.example apps/web/.env
          poner() {
            grep -q "^$1=" apps/api/.env || { echo "::error::falta $1 en apps/api/.env.example"; exit 1; }
            sed -i "s|^$1=.*|$1=$2|" apps/api/.env
          }
          poner APP_KEY "base64:$app_key_raw"
          poner DB_PASSWORD "$app"
          poner DB_OWNER_PASSWORD "$owner"
          poner DB_PLATFORM_PASSWORD "$platform"

      - name: Resolver los nombres de los centros de prueba
        run: echo "127.0.0.1 demo.plataforma.test demo2.plataforma.test" | sudo tee -a /etc/hosts

      - name: Crear la red externa de compose
        run: docker network create plataforma-net

      # PostgreSQL y Redis primero: `composer install` arranca Laravel (artisan package:discover) y sin base de datos puede colgarse
      # (issue #132). Sus puertos publicados (127.0.0.1:5432 y :6379) son los de apps/api/.env.example.
      - name: Levantar PostgreSQL y Redis
        run: docker compose up -d --wait --wait-timeout 120 postgres redis

      # El bind mount ./apps/api:/var/www/html tapa el código de la imagen `dev` y esa imagen no instala dependencias
      # (ADR-091 §10): `apps/api/vendor` debe existir en el host antes de levantar `api`.
      - name: composer install en el host
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress

      # Nombrar `worker` y `garage` activa sus perfiles (`worker`, `full`); `web` no lleva perfil y no se nombra nunca: su puerto
      # 5173 chocaría con el `webServer` de Playwright. `api` sirve con `php artisan serve` (ADR-091 §10, no FrankenPHP).
      - name: Levantar la pila (postgres redis api worker garage)
        run: |
          set -euo pipefail
          # El bind mount lo escribe el usuario del contenedor; sin esto, storage/ y bootstrap/cache pueden no ser escribibles.
          chmod -R a+rwX apps/api/storage apps/api/bootstrap/cache
          docker compose up -d --build postgres redis api worker garage

      - name: Migraciones y registro de plataforma
        run: |
          set -euo pipefail
          docker compose exec -T api php artisan migrate --database=pgsql_owner --force
          docker compose exec -T api php artisan platform:sync-registry

      - name: Esperar a la API e inicializar Garage
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            curl -sf -m 3 -o /dev/null http://127.0.0.1:8000/api/health && ok=1 && break
            sleep 2
          done
          [ "${ok:-0}" = 1 ] || { echo "::error::/api/health no respondió a tiempo"; exit 1; }
          bash infra/garage/init.sh
          echo "E2E_T_PILA=$(date +%s)" >> "$GITHUB_ENV"

      # Sin reintentos (D5): --retries=0 explícito además de la configuración. Trazas solo de lo que falla.
      # Las tres órdenes en serie y sin cortar entre sí (para medir todas): cada fallo se anota y el paso termina en rojo al final.
      # Con E2E_INFORMES_DIR cada suite escribe `<clave>.json`, `playwright-report/<clave>/` y `test-results/<clave>/` (lib/e2e-informe.sh).
      - name: Playwright (E2E real, todas las suites)
        id: playwright
        working-directory: apps/web
        run: |
          set -uo pipefail
          mkdir -p "$E2E_INFORMES_DIR"
          opciones=(--retries=0 --trace=retain-on-failure --reporter=json,html)
          fallos=()
          for orden in test:e2e:real:prl test:e2e:real:alum test:e2e:real; do
            echo "::group::npm run $orden"
            npm run "$orden" -- "${opciones[@]}" || fallos+=("$orden")
            echo "::endgroup::"
          done
          if [ "${#fallos[@]}" -gt 0 ]; then
            echo "::error::Órdenes de E2E real con fallo: ${fallos[*]}"
            exit 1
          fi

      # Un verde exige tests ejecutados: ningún `skipped` y no menos pasados que los esperados (apps/web/e2e/e2e-real-esperados.json).
      # Una suite sin informe es una suite no ejecutada: rojo. Se corre aunque Playwright haya fallado, para ver el estado de cada suite.
      - name: Comprobar que se ejecutaron los tests esperados
        if: ${{ !cancelled() && steps.playwright.conclusion != 'skipped' }}
        working-directory: apps/web
        run: |
          set -uo pipefail
          rojo=0
          {
            echo "### Tests por suite"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # Toda clave esperada (sin las que empiezan por `_`) debe tener su informe.
          claves="$(jq -r 'keys[] | select(startswith("_") | not)' e2e/e2e-real-esperados.json)" || {
            echo "::error::No se pudo leer e2e/e2e-real-esperados.json"
            exit 1
          }
          if [ -z "$claves" ]; then
            echo "::error::e2e/e2e-real-esperados.json no declara ninguna suite"
            exit 1
          fi
          for clave in $claves; do
            if [ ! -f "$E2E_INFORMES_DIR/$clave.json" ]; then
              echo "::error::Falta el informe de la suite «$clave»: no se ejecutó"
              echo "- «$clave»: SIN INFORME (no ejecutada)" >> "$GITHUB_STEP_SUMMARY"
              rojo=1
            fi
          done
          shopt -s nullglob
          for informe in "$E2E_INFORMES_DIR"/*.json; do
            clave="$(basename "$informe" .json)"
            node scripts/e2e-real-verificar.mjs "$informe" "$clave" | tee -a "$GITHUB_STEP_SUMMARY" || rojo=1
          done
          exit "$rojo"

      - name: Tiempos y resumen
        if: always()
        working-directory: apps/web
        run: |
          set -uo pipefail
          ahora="$(date +%s)"
          {
            [ -n "${E2E_T_INSTALADO:-}" ] && echo "E2E_TIEMPO suite=ci fase=instalacion segundos=$((E2E_T_INSTALADO - E2E_T_INICIO))"
            [ -n "${E2E_T_PILA:-}" ] && echo "E2E_TIEMPO suite=ci fase=pila segundos=$((E2E_T_PILA - E2E_T_INSTALADO))"
            echo "E2E_TIEMPO suite=ci fase=total segundos=$((ahora - E2E_T_INICIO))"
          } >> "$E2E_TIEMPOS_LOG"
          {
            echo "## E2E real · todas las suites"
            echo
            shopt -s nullglob
            echo "| Suite | Pasados | Fallidos | Saltados | Intermitentes |"
            echo "|---|---:|---:|---:|---:|"
            for informe in "$E2E_INFORMES_DIR"/*.json; do
              jq -r --arg s "$(basename "$informe" .json)" '"| \($s) | \(.stats.expected) | \(.stats.unexpected) | \(.stats.skipped) | \(.stats.flaky) |"' "$informe"
            done
            echo
            echo "### Tiempos por suite y fase (segundos)"
            echo
            node scripts/e2e-real-tiempos.mjs "$E2E_TIEMPOS_LOG" "$RUNNER_TEMP/e2e-tiempos.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Últimas líneas de los registros de api, worker y Garage
        if: failure()
        run: |
          for c in plataforma-api plataforma-worker plataforma-garage; do
            echo "::group::$c"
            docker logs --tail 80 "$c" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Subir los tiempos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-real-tiempos
          path: ${{ runner.temp }}/e2e-tiempos.json
          if-no-files-found: ignore
          retention-days: 7

      # Solo si falla: informe y trazas de Playwright (datos sintéticos; sin .env ni registros completos de contenedores).
      - name: Subir informe y trazas de Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-real-informe-fallo
          path: |
            ${{ runner.temp }}/e2e-informes
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Único check que se marca como requerido (a mano, SYSADMIN.md §4). Sin checkout: se ejecuta en la raíz.
  # Regla de ADR-091 §2.4. Un `skipped` solo es verde tras la decisión explícita `ejecutar=false` de `cambios`.
  agregador:
    name: E2E real (API)
    runs-on: ubuntu-26.04  # fijada: ubuntu-latest migra a 26.04 hasta el 19-11-2026 (#609, actions/runner-images#14748)
    needs: [cambios, e2e-real]
    if: always()
    steps:
      - name: Verde solo con decisión registrada de `cambios` y resultado coherente de `e2e-real`
        env:
          CAMBIOS: ${{ needs.cambios.result }}
          EJECUTAR: ${{ needs.cambios.outputs.ejecutar }}
          E2E_REAL: ${{ needs.e2e-real.result }}
        run: |
          echo "cambios=$CAMBIOS ejecutar=$EJECUTAR e2e-real=$E2E_REAL"
          if [ "$CAMBIOS" = "success" ] && [ "$EJECUTAR" = "false" ] && [ "$E2E_REAL" = "skipped" ]; then
            echo "Sin cambios que ejecuten el E2E real: verde."
            exit 0
          fi
          if [ "$CAMBIOS" = "success" ] && [ "$EJECUTAR" = "true" ] && [ "$E2E_REAL" = "success" ]; then
            echo "E2E real ejecutado y en verde."
            exit 0
          fi
          echo "::error::E2E real (API) en rojo: cambios=$CAMBIOS ejecutar=$EJECUTAR e2e-real=$E2E_REAL"
          exit 1
