name: CI · API

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

defaults:
  run:
    working-directory: apps/api

jobs:
  test:
    name: Tests (Pest)
    runs-on: ubuntu-latest
    # ADR-033 §10: PostgreSQL real, no SQLite. RLS es la barrera primaria y
    # SQLite no la tiene: un test de aislamiento sobre SQLite daría verde
    # con las políticas ausentes.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: plataforma_test
          POSTGRES_USER: plataforma
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plataforma"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: plataforma_app
      DB_PASSWORD: ci-tenancy-app
      DB_OWNER_USERNAME: plataforma_owner
      DB_OWNER_PASSWORD: ci-tenancy-owner
      DB_PLATFORM_USERNAME: plataforma_platform
      DB_PLATFORM_PASSWORD: ci-tenancy-platform
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, zip, intl, mbstring, redis
          coverage: none

      - uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # .env antes de composer install: el hook postAutoloadDump de Composer
      # arranca Laravel (artisan package:discover), y sin .env el entorno
      # cae al valor por defecto de Laravel (production) — SessionEnvironmentGuard
      # aborta el arranque entero (issue #132).
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: php artisan key:generate

      # El servicio postgres arranca antes del checkout, así que no puede
      # montar infra/containers/postgres/init como docker-entrypoint-initdb.d
      # (ver SYSADMIN.md §2b): se aplica el mismo script a mano, ya con el
      # repositorio disponible. Contraseñas fijas de CI, sin relación con
      # ningún secreto: la base es efímera y se destruye al terminar el job.
      - name: Provisionar esquema y roles de tenancy (ADR-033)
        env:
          PGPASSWORD: ci-postgres
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql -h 127.0.0.1 -U plataforma -d plataforma_test \
            -v owner_password=ci-tenancy-owner \
            -v app_password=ci-tenancy-app \
            -v platform_password=ci-tenancy-platform \
            -v dbname=plataforma_test \
            -f infra/containers/postgres/init/01-tenancy.sql.tpl

      - run: composer test

  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # Ver comentario del job "test": .env antes de composer install (issue #132).
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: composer lint

  static-analysis:
    name: Análisis estático (Larastan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # Ver comentario del job "test": .env antes de composer install (issue #132).
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: composer analyse
