name: CI · API

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

defaults:
  run:
    working-directory: apps/api

jobs:
  test:
    name: Tests (Pest)
    runs-on: ubuntu-latest
    # ADR-033 §10: PostgreSQL real, no SQLite. RLS es la barrera primaria y
    # SQLite no la tiene: un test de aislamiento sobre SQLite daría verde
    # con las políticas ausentes.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: plataforma_test
          POSTGRES_USER: plataforma
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plataforma"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: plataforma_app
      DB_PASSWORD: ci-tenancy-app
      DB_OWNER_USERNAME: plataforma_owner
      DB_OWNER_PASSWORD: ci-tenancy-owner
      DB_PLATFORM_USERNAME: plataforma_platform
      DB_PLATFORM_PASSWORD: ci-tenancy-platform
      REDIS_HOST: 127.0.0.1
      # .env.example trae el valor de partida del starter kit (120), inferior
      # al mínimo que exige RN-AUTH-30 (issue #62, pendiente en el propio
      # .env.example de desarrollo). SessionEnvironmentGuard aborta el
      # arranque sin esto (issue #132).
      SESSION_LIFETIME: "480"
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, zip, intl, mbstring, redis
          coverage: none

      - uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # .env antes de composer install: el hook postAutoloadDump de Composer
      # arranca Laravel (artisan package:discover), y sin .env el entorno
      # cae al valor por defecto de Laravel (production) — SessionEnvironmentGuard
      # aborta el arranque entero (issue #132).
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: php artisan key:generate

      # El servicio postgres arranca antes del checkout, así que no puede
      # montar infra/containers/postgres/init como docker-entrypoint-initdb.d
      # (ver SYSADMIN.md §2b): se aplica el mismo script a mano, ya con el
      # repositorio disponible. Contraseñas fijas de CI, sin relación con
      # ningún secreto: la base es efímera y se destruye al terminar el job.
      - name: Provisionar esquema y roles de tenancy (ADR-033)
        # El fichero está en infra/, relativo a la raíz del repo, no a
        # apps/api (defaults.run.working-directory de este workflow) — issue #135.
        working-directory: .
        env:
          PGPASSWORD: ci-postgres
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql -h 127.0.0.1 -U plataforma -d plataforma_test \
            -v owner_password=ci-tenancy-owner \
            -v app_password=ci-tenancy-app \
            -v platform_password=ci-tenancy-platform \
            -v dbname=plataforma_test \
            -f infra/containers/postgres/init/01-tenancy.sql.tpl

      # REQ-AUTH-004 (1.4b), operacion.md §F.10: el emisor OIDC simulado
      # se sirve por la propia API en local/testing, y la suite Pest lo
      # alcanza por HTTP real (no en proceso) para probar de verdad las
      # cinco guardas SSRF de CurlDiscoveryDocumentValidator. En
      # desarrollo eso lo da el contenedor `api`, que ya sirve en el
      # puerto 8000 de forma continua (SYSADMIN.md); este job no arrancaba
      # ningún servidor, así que la petición saliente del validador no
      # tenía nada que atender y toda la suite de 1.4b fallaba en CI con
      # auth.sso.discovery.sin_respuesta pese a pasar en local. `pest`
      # corre como proceso CLI aparte de este servidor, así que no aplica
      # el interbloqueo de un solo hilo del issue #146 (ahí el conflicto
      # es con una petición *entrante* del navegador, no con el propio
      # proceso de test).
      #
      # El servidor necesita el esquema ya migrado: tests/TestCase.php
      # migra de forma perezosa (una sola vez, guardada en una bandera
      # estática) dentro del propio proceso de Pest, en el primer setUp()
      # — un proceso de artisan serve aparte nunca pasa por ahí, así que
      # sin este paso toda petición que tocara sesión (SESSION_DRIVER=
      # database) fallaba contra un esquema inexistente. Primer intento
      # de este arreglo, sin migrar antes: /api/health respondía rápido
      # pero con error, y el bucle de espera nunca veía un 200.
      - name: Arrancar servidor de desarrollo (emisor OIDC simulado)
        # DB_DATABASE: .env.example trae "plataforma" (valor de desarrollo);
        # el servicio postgres de este job crea "plataforma_test"
        # (POSTGRES_DB de arriba). phpunit.xml fuerza DB_DATABASE=
        # plataforma_test dentro del propio proceso de Pest, pero este paso
        # invoca artisan directamente, fuera de ese mecanismo — sin esto,
        # migra (y el servidor sirve) contra una base que no existe.
        env:
          DB_DATABASE: plataforma_test
        run: |
          php artisan migrate --database=pgsql_owner --force
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/artisan-serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8000/api/health && exit 0
            sleep 1
          done
          echo "::error::php artisan serve no respondió a tiempo en el puerto 8000"
          cat /tmp/artisan-serve.log
          exit 1

      - run: composer test

  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest
    # Mismos servicios que "test": el arranque del framework durante
    # composer install (artisan package:discover) puede intentar resolver
    # una conexión de base de datos/caché real, no solo leer config
    # (issue #132) — sin ellos el job se cuelga en vez de fallar rápido.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: plataforma_test
          POSTGRES_USER: plataforma
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plataforma"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: plataforma_app
      DB_PASSWORD: ci-tenancy-app
      REDIS_HOST: 127.0.0.1
      SESSION_LIFETIME: "480"
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # Ver comentario del job "test": .env antes de composer install (issue #132).
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: composer lint

  static-analysis:
    name: Análisis estático (Larastan)
    runs-on: ubuntu-latest
    # Ver comentario del job "lint" sobre los servicios.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: plataforma_test
          POSTGRES_USER: plataforma
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plataforma"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: plataforma_app
      DB_PASSWORD: ci-tenancy-app
      REDIS_HOST: 127.0.0.1
      SESSION_LIFETIME: "480"
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # Ver comentario del job "test": .env antes de composer install (issue #132).
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: composer analyse
